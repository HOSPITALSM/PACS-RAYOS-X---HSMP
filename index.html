  background:linear-gradient(90deg,#12323d,#0f2831);

  box-shadow:0 0 0 1px #5ed2e51a,0 6px 20px #0005, inset 3px 0 0 #5ed2e5;
}
.patient.active::after{
  content:"";
  position:absolute;
  right:9px;
  top:50%;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#5ed2e5;
  box-shadow:0 0 8px #5ed2e5aa;
  transform:translateY(-50%);
}

  align-items:center;
  justify-content:center;

}

  height:100%;
  max-width:none;
  max-height:none;

  object-fit:contain;

PACS.constants = {
  months: ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"],
  weekdays: ["L","M","M","J","V","S","D"],

    "COLUMNA CERVICAL","COLUMNA DORSAL","COLUMNA LUMBAR","COLUMNA LUMBOSACRA","COLUMNA COMPLETA","ESCOLIOSIS",
    "CRÁNEO","SENOS PARANASALES","HUESOS PROPIOS DE LA NARIZ","MACIZO FACIAL","MANDÍBULA","MASTOIDES","CUELLO",
    "CLAVÍCULA","ACROMIOCLAVICULAR","ESCÁPULA","HOMBRO","HÚMERO","CODO","ANTEBRAZO","MUÑECA","MANO","DEDOS DE LA MANO","PULGAR",
    "FÉMUR","RODILLA","RÓTULA","PIERNA","TOBILLO","PIE","CALCÁNEO","DEDOS DEL PIE",

/* ===== supabase.js ===== */
window.PACS = window.PACS || {};
PACS.supabase = {
  async init(){
    if(!window.supabase) throw new Error("No se cargó la librería de Supabase.");
    PACS.state.client = window.supabase.createClient(PACS.config.supabaseUrl, PACS.config.publishableKey);
    return PACS.state.client;
  },
  async storageUpload(path, file, options={}){
    const candidates = [PACS.state.storageBucket, ...PACS.config.storageBuckets.filter(x=>x!==PACS.state.storageBucket)];
    let last = null;
    for(const bucket of candidates){
      // Los archivos usan nombres únicos y no se reemplazan. Un caché largo evita
      // transferencias repetidas desde Storage/CDN sin modificar el archivo original.
      const res = await PACS.state.client.storage.from(bucket).upload(path, file, {
        upsert:false,
        cacheControl: options.cacheControl || "31536000",
        ...(options.contentType?{contentType:options.contentType}:{})
      });
      if(!res.error){ PACS.state.storageBucket = bucket; return res; }
      last = res.error;
    }
    return {error:last || new Error("No se encontró el bucket de imágenes.")};
  },
  async signedUrl(path){
    const candidates = [PACS.state.storageBucket, ...PACS.config.storageBuckets.filter(x=>x!==PACS.state.storageBucket)];
    for(const bucket of candidates){
      const res = await PACS.state.client.storage.from(bucket).createSignedUrl(path, 3600);
      if(!res.error && res.data?.signedUrl){
        PACS.state.storageBucket = bucket;
        return res.data.signedUrl;
      }
    }
    return "";
  },
  async remove(path){
    if(!path) return {data:null,error:null};
    const candidates = [PACS.state.storageBucket, ...PACS.config.storageBuckets.filter(x=>x!==PACS.state.storageBucket)];
    let lastError=null;
    for(const bucket of candidates){
      const res = await PACS.state.client.storage.from(bucket).remove([path]);
      if(!res.error){
        PACS.state.storageBucket=bucket;
        return res;
      }
      lastError=res.error;
    }
    return {data:null,error:lastError||new Error("No se pudo eliminar el archivo del Storage.")};
  },
  async removeItems(items){
    const failures=[];
    for(const item of (items||[])){
      const path=PACS.data.imagePath(item);
      if(!path) continue;
      const res=await this.remove(path);
      if(res.error) failures.push({item,path,error:res.error});
    }
    return failures;
  }
};


/* ===== data.js ===== */
window.PACS = window.PACS || {};

/* ===== gender persistence fallback ===== */
PACS.gender = {
  key: "pacs_patient_gender_v1",
  read(){
    try { return JSON.parse(localStorage.getItem(this.key)||"{}"); }
    catch(e){ return {}; }
  },
  write(name, sex){
    if(!name || !sex) return;
    try{
      const data=this.read();
      data[String(name).trim().toUpperCase()]=String(sex).trim().toUpperCase();
      localStorage.setItem(this.key, JSON.stringify(data));
    }catch(e){}
  },
  get(name){
    const data=this.read();
    return String(data[String(name).trim().toUpperCase()]||"").trim().toUpperCase();
  }
};

PACS.data = {
  dateLabel(value){
    if(!value) return "";
    const raw = String(value).trim();
    const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(m){
      const mon = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
      return `${m[3]} ${mon[Number(m[2])-1]} ${m[1]}`;
    }
    const d = new Date(raw);
    if(Number.isNaN(d.getTime())) return raw.toUpperCase();
    const mon = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
    return `${String(d.getDate()).padStart(2,"0")} ${mon[d.getMonth()]} ${d.getFullYear()}`.toUpperCase();
  },
  dateISO(label){
    const [d, mon, y] = String(label).split(" ");
    const map={ENE:"01",FEB:"02",MAR:"03",ABR:"04",MAY:"05",JUN:"06",JUL:"07",AGO:"08",SEP:"09",OCT:"10",NOV:"11",DIC:"12"};
    return `${y}-${map[mon]}-${String(d).padStart(2,"0")}`;
  },
  imageItems(study){ return Array.isArray(study?.images) ? study.images : []; },
  imagePath(item){ return typeof item==="string" ? item : (item?.path || item?.storagePath || ""); },
  imageUrl(item){ return typeof item==="string" ? "" : (item?.url || item?.publicUrl || item?.localUrl || ""); },
  studyCount(study){ return this.imageItems(study).length || Number(study?.imageCount || 0) || 0; },
  mapRows(rows){
    const groups = new Map();
    (rows||[]).forEach((r, idx)=>{
      const name=String(r.patient||"").trim().toUpperCase();
      if(!name) return;
      const id=`patient-${encodeURIComponent(name)}`;
      if(!groups.has(id)) groups.set(id,{id,name,sex:String((r.sex??r.gender??PACS.gender.get(name)??"")).trim().toUpperCase(),studies:[]});
      groups.get(id).studies.push({
        id:r.id,
        date:this.dateLabel(r.date),
        study:String(r.structure||r.study||r.modality||"ESTUDIO").trim().toUpperCase(),
        modality:r.modality||"",
        images:Array.isArray(r.images)?r.images:[],
        createdAt:r.created_at||""
      });
    });
    for(const p of groups.values()){
      p.studies.sort((a,b)=>String(b.date).localeCompare(a.date)||String(b.createdAt).localeCompare(a.createdAt));
    }
    return [...groups.values()];
  },
  async loadStudies(){
    const previous=new Map(
      (PACS.state.patients||[]).map(p=>[
        String(p.name||"").trim().toUpperCase(),
        String(p.sex||"").trim().toUpperCase()
      ])
    );

    const {data,error}=await PACS.state.client
      .from("studies")
      .select("*")
      .order("date",{ascending:false})
      .order("created_at",{ascending:false});

    if(error) throw error;

    const fresh=this.mapRows(data||[]);

    // Supabase actualmente no tiene sex/gender en "studies".
    // Conservamos el sexo que ya conocemos al reconstruir la lista.
    fresh.forEach(p=>{
      const previousSex=previous.get(String(p.name||"").trim().toUpperCase());
      const storedSex=PACS.gender.get(p.name);
      p.sex=String(p.sex||previousSex||storedSex||"").trim().toUpperCase();
    });

    PACS.state.patients=fresh;
    return PACS.state.patients;
  },
  async hydrateImages(study=PACS.data.currentStudy()){
    if(!study?.images?.length) return;
    const selectedIndex=Math.max(0,Math.min(study.images.length-1,(PACS.state.selectedImage||1)-1));
    const now=Date.now();
    const refreshSoon=(expiresAt)=>!expiresAt || expiresAt-now<5*60*1000;

    for(let i=0;i<study.images.length;i++){
      let item=study.images[i];
      const path=PACS.data.imagePath(item);
      if(!path) continue;

      // Compatibilidad con registros antiguos que guardaban solo el path como texto.
      if(typeof item==="string"){
        item=study.images[i]={path,name:`Imagen ${i+1}`,url:"",thumbUrl:""};
      }

      // La RX completa solo obtiene URL cuando es la imagen seleccionada.
      // Así las demás imágenes del estudio no se descargan por anticipado.
      if(i===selectedIndex && refreshSoon(item.urlExpiresAt)){
        const url=await PACS.supabase.signedUrl(path);
        if(url){
          item.url=url;
          item.urlExpiresAt=Date.now()+55*60*1000;
          item.publicUrl="";
          item.localUrl=item.pending?item.localUrl:"";
        }
      }

      // Las miniaturas nuevas tienen un archivo pequeño independiente.
      // Las imágenes antiguas sin thumbPath muestran un botón numerado y no
      // vuelven a descargar la RX completa solo para dibujar la miniatura.
      if(item.thumbPath && refreshSoon(item.thumbUrlExpiresAt)){
        const thumbUrl=await PACS.supabase.signedUrl(item.thumbPath);
        if(thumbUrl){
          item.thumbUrl=thumbUrl;
          item.thumbUrlExpiresAt=Date.now()+55*60*1000;
        }
      }
    }
  },
  findPatient(id){ return PACS.state.patients.find(p=>p.id===id)||null; },
  currentStudy(){
    const p=PACS.state.selectedPatient;
    return p?.studies?.[PACS.state.selectedStudyIndex]||null;
  },
  patientsForDate(date=PACS.state.selectedDate){
    return PACS.state.patients.filter(p=>p.studies.some(s=>s.date===date));
  }
};

/* ===== auth.js ===== */
window.PACS = window.PACS || {};
PACS.auth = {
  async login(email,password){
    if(!PACS.state.client) await PACS.supabase.init();
    const {data,error}=await PACS.state.client.auth.signInWithPassword({email,password});
    if(error || !data?.user) throw new Error("Correo o contraseña incorrectos.");
    const uid=data.user.id;
    if(uid===PACS.config.roles.admin) PACS.state.role="admin";
    else if(uid===PACS.config.roles.viewer) PACS.state.role="viewer";
    else {
      await PACS.state.client.auth.signOut();
      throw new Error("Este usuario no tiene acceso autorizado al PACS.");
    }
    PACS.state.logged=true;
  },
  async restore(){
    const {data,error}=await PACS.state.client.auth.getSession();
    if(error || !data?.session?.user) return false;
    const uid=data.session.user.id;
    if(uid===PACS.config.roles.admin) PACS.state.role="admin";
    else if(uid===PACS.config.roles.viewer) PACS.state.role="viewer";
    else { await PACS.state.client.auth.signOut(); return false; }
    PACS.state.logged=true;
    return true;
  },
  async logout(){
    await PACS.state.client.auth.signOut();
    Object.assign(PACS.state,{logged:false,role:"",selectedPatient:null,selectedStudyIndex:0,selectedImage:0});
  }
};


/* ===== images.js ===== */
window.PACS = window.PACS || {};
PACS.images = {
  localPreview(file){
    return {localUrl:URL.createObjectURL(file),name:file.name,path:"",url:"",thumbUrl:"",pending:true};
  },
  revoke(items){
    (items||[]).forEach(x=>{ if(x?.localUrl) try{URL.revokeObjectURL(x.localUrl)}catch(_){}; });
  },
  async makeThumbnail(file){
    // IMPORTANTE: esta función crea un archivo APARTE solo para la miniatura.
    // El archivo radiográfico original se sube exactamente como fue seleccionado.
    if(!file?.type?.startsWith("image/")) return null;
    try{
      const bitmap=await createImageBitmap(file);
      const maxSide=240;
      const ratio=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
      const width=Math.max(1,Math.round(bitmap.width*ratio));
      const height=Math.max(1,Math.round(bitmap.height*ratio));
      const canvas=document.createElement("canvas");
      canvas.width=width; canvas.height=height;
      const ctx=canvas.getContext("2d",{alpha:false});
      if(!ctx){ bitmap.close?.(); return null; }
      ctx.drawImage(bitmap,0,0,width,height);
      bitmap.close?.();
      return await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.72));
    }catch(err){
      console.warn("No se pudo crear miniatura local:",err);
      return null;
    }
  },
  async uploadForStudy(studyId, files){
    const uploaded=[];
    for(const file of files){
      const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const token=`${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
      const path=`studies/${studyId}/${token}_${safe}`;

      // RX ORIGINAL: se envía el mismo File recibido del equipo/PC.
      // No hay canvas, resize, recompress ni conversión sobre este archivo.
      const up=await PACS.supabase.storageUpload(path,file);
      if(up.error) throw up.error;

      let thumbPath="";
      const thumb=await this.makeThumbnail(file);
      if(thumb){
        thumbPath=`studies/${studyId}/thumbs/${token}.jpg`;
        const thumbUp=await PACS.supabase.storageUpload(thumbPath,thumb,{contentType:"image/jpeg"});
        if(thumbUp.error){
          console.warn("La RX se guardó, pero no se pudo guardar su miniatura:",thumbUp.error);
          thumbPath="";
        }
      }
      uploaded.push({path,thumbPath,name:file.name});
    }
    return uploaded;
  },
  async removeItem(item){
    const paths=[PACS.data.imagePath(item),item?.thumbPath||""].filter(Boolean);
    for(const path of paths){
      const res=await PACS.supabase.remove(path);
      if(res.error) throw res.error;
    }
  },
  async removeItems(items){
    const failures=[];
    for(const item of (items||[])){
      try{ await this.removeItem(item); }
      catch(error){ failures.push({item,error}); }
    }
    return failures;
  }
};

window.PACS = window.PACS || {};
PACS.patients = {
  select(id){
    const p=PACS.data.findPatient(id);
    if(!p){PACS.ui.toast("No se encontró el paciente.");return;}
    PACS.state.selectedPatient=p;
    const idx=p.studies.findIndex(s=>s.date===PACS.state.selectedDate);
    PACS.state.selectedStudyIndex=idx>=0?idx:0;
    PACS.state.selectedImage=PACS.data.studyCount(PACS.data.currentStudy())>0?1:0;
    PACS.app.resetViewer();
    PACS.app.render();
    PACS.data.hydrateImages(PACS.data.currentStudy()).then(()=>PACS.app.render()).catch(err=>console.error("Image refresh:",err));
    if(window.matchMedia?.("(max-width: 850px)").matches){
      this.closeSide();
      document.querySelectorAll(".mobile-nav button").forEach(b=>b.classList.remove("active"));
      document.querySelector('.mobile-nav button[data-mobile="viewer"]')?.classList.add("active");
    }
  },
  async add({name,study,date,files=[],sex=""}){
    // El sexo se guarda en Supabase para que ♂/♀ sea consistente en cualquier dispositivo.
    const selectedSex=String(sex||"").trim().toUpperCase();
    const payload={
      patient:name,
      date:PACS.data.dateISO(date),
      study,
      structure:study,
      modality:(["TC","RM","MAMOGRAFÍA","ECOGRAFÍA"].includes(study)?study:"RX"),
      images:[],
      sex:selectedSex||null
    };

    const {data,error}=await PACS.state.client
      .from("studies")
      .insert(payload)
      .select("*")
      .single();

    if(error) throw error;

    const localPreview=files.map(PACS.images.localPreview);
    const pLocal={
      id:`patient-${encodeURIComponent(name)}`,
      name,
      sex:selectedSex,
      studies:[{
        id:data.id,
        date,
        study,
        modality:data.modality,
        images:localPreview,
        createdAt:data.created_at||""
      }]
    };

    if(selectedSex) PACS.gender.write(name,selectedSex);

    const existing=PACS.state.patients.find(p=>p.id===pLocal.id);
    if(existing){
      existing.studies.push(pLocal.studies[0]);
      if(!existing.sex) existing.sex=selectedSex;
    }else{
      PACS.state.patients.push(pLocal);
    }

    PACS.state.selectedPatient=existing||pLocal;
    PACS.state.selectedStudyIndex=(existing?existing:pLocal).studies.length-1;
    PACS.state.selectedImage=files.length?1:0;
    PACS.app.render();

    try{
      const uploaded=files.length?await PACS.images.uploadForStudy(data.id,files):[];
      if(uploaded.length){
        const {error:updateError}=await PACS.state.client
          .from("studies")
          .update({images:uploaded})
          .eq("id",data.id);
        if(updateError) throw updateError;
        const studyRow=PACS.data.currentStudy();
        if(studyRow) studyRow.images=uploaded;
        PACS.images.revoke(localPreview);
        await PACS.data.hydrateImages();
      }
      PACS.app.render();
      PACS.ui.toast(files.length
        ?`Paciente e ${files.length} imagen(es) guardados.`
        :"Paciente agregado correctamente.");
      return pLocal;
    }catch(err){
      const studyRow=PACS.data.currentStudy();
      if(studyRow) studyRow.images=[];
      PACS.images.revoke(localPreview);
      PACS.app.render();
      PACS.ui.toast(err?.message||"Paciente creado, pero no se pudieron guardar las imágenes.");
    }
  },
  async updateName(newName,newSex=""){
    const p=PACS.state.selectedPatient;
    if(!p) throw new Error("Selecciona un paciente primero.");
    const oldName=p.name;
    const oldSex=String(p.sex||"").trim().toUpperCase();
    const selectedSex=String(newSex||"").trim().toUpperCase();
    const nameChanged=oldName!==newName;
    const sexChanged=!!selectedSex && selectedSex!==oldSex;
    if(!nameChanged && !sexChanged) return;

    const updates={};
    if(nameChanged) updates.patient=newName;
    if(selectedSex) updates.sex=selectedSex;

    // Actualización optimista de la interfaz.
    p.name=newName;
    if(selectedSex) p.sex=selectedSex;
    PACS.app.render();
    try{
      const {error}=await PACS.state.client.from("studies").update(updates).eq("patient",oldName);
      if(error) throw error;
      if(selectedSex) PACS.gender.write(newName,selectedSex);
      PACS.ui.toast("Paciente modificado correctamente.");
    }catch(err){
      p.name=oldName;
      p.sex=oldSex;
      PACS.app.render();
      throw err;
    }
  },
  async remove(){
    const p=PACS.state.selectedPatient;
    if(!p) throw new Error("Selecciona un paciente primero.");
    const backup=[...PACS.state.patients];
    PACS.state.patients=PACS.state.patients.filter(x=>x.id!==p.id);
    PACS.state.selectedPatient=null;
    PACS.state.selectedStudyIndex=0; PACS.state.selectedImage=0;
    PACS.app.render();
    const imageItems=p.studies.flatMap(s=>PACS.data.imageItems(s));
    const {error}=await PACS.state.client.from("studies").delete().eq("patient",p.name);
    if(error){
      PACS.state.patients=backup;
      PACS.state.selectedPatient=p;
      PACS.app.render();
      throw error;
    }
    const failures=await PACS.images.removeItems(imageItems);
    if(failures.length){
      console.warn("Archivos que no pudieron eliminarse de Storage:",failures);
      PACS.ui.toast(`Paciente eliminado. ${failures.length} archivo(s) quedaron pendientes de limpieza en Storage.`);
    }else{
      PACS.ui.toast(imageItems.length?"Paciente y todas sus imágenes eliminados correctamente.":"Paciente eliminado correctamente.");
    }
    try{
      await PACS.data.loadStudies();
    }catch(err){
      console.error("PACS: refresco posterior a eliminación:",err);
      // La eliminación ya está confirmada en Supabase; no restauramos el paciente.
    }
    PACS.state.selectedPatient=null;
    PACS.state.selectedStudyIndex=0;
    PACS.state.selectedImage=0;
    PACS.app.render();
  }
};

/* ===== view.js ===== */
window.PACS = window.PACS || {};
PACS.view = {
  patientIcon(sex){
    const v=String(sex??"").trim().toUpperCase();
    const male=["M","MALE","MASCULINO","HOMBRE","1"].includes(v);
    const female=["F","FEMALE","FEMENINO","MUJER","2"].includes(v);
    if(male) return '<span class="sex-symbol male" aria-label="Masculino" title="Masculino">♂</span>';
    if(female) return '<span class="sex-symbol female" aria-label="Femenino" title="Femenino">♀</span>';
    return '<span class="sex-symbol unknown" aria-label="Sexo no especificado" title="Sexo no especificado">•</span>';
  },
  patientList(){
    const list=PACS.data.patientsForDate();
    if(!list.length) return `<div class="patient-empty">No hay pacientes registrados en esta fecha.</div>`;
    return list.map(p=>{
      const active=PACS.state.selectedPatient?.id===p.id;
      const dayStudies=p.studies.filter(x=>x.date===PACS.state.selectedDate);
      const studies=dayStudies.length?dayStudies:p.studies.slice(0,1);
      const imageCount=studies.reduce((n,x)=>n+PACS.data.studyCount(x),0);
      const first=studies[0];
      const studyLabel=studies.length>1?`${studies.length} estudios`:first?.study||"Ver historial";
      return `<button type="button" class="patient ${active?"active":""}" data-patient="${encodeURIComponent(p.id)}"><strong class="patient-name">${this.patientIcon(p.sex)}${p.name}</strong><span>${studyLabel} · ${imageCount} imágenes</span></button>`;
    }).join("");
  },
  history(){
    const p=PACS.state.selectedPatient;
    if(!p?.studies?.length) return `<div class="muted">No hay estudios registrados para este paciente.</div>`;
    let last="",out="";
    p.studies.forEach((s,i)=>{
      if(s.date!==last){ out+=`<div class="day">${s.date}</div>`; last=s.date; }
      out+=`<button type="button" class="study ${i===PACS.state.selectedStudyIndex?"active-study":""}" data-study-index="${i}">
        <div><b>🩻 ${s.study}</b><br><span>${s.createdAt?new Date(s.createdAt).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}):""} · <span class="ok">Disponible</span></span></div>
        <span>${PACS.data.studyCount(s)} imágenes ›</span>
      </button>`;
    });
    return out;
  },
  renderThumbs(study){
    const items=PACS.data.imageItems(study);
    if(!items.length) return "";
    return items.map((item,i)=>{
      const thumbUrl=(typeof item==="object" && item)?(item.thumbUrl||item.localUrl||""):"";
      const label=(typeof item==="object" && item?.name)?item.name:`Imagen ${i+1}`;
      return `<button type="button" class="thumb ${PACS.state.selectedImage===i+1?"active":""}" data-image-index="${i+1}">
        ${thumbUrl?`<img src="${thumbUrl}" alt="${label}" loading="lazy" decoding="async">`:`<span class="thumb-loading">IMG ${i+1}</span>`}<span>${i+1}</span>
      </button>`;
    }).join("");
  }
};

window.handleFiles=function(files,target){
  const arr=Array.from(files||[]);
  const state=window.PACS?.state;
  if(!state || !arr.length)return;

  const scope=target==="patientFiles"?"patient":"add";
  const pickerId=scope==="patient"?"pStudyType":"aStudyType";
  const study=(document.getElementById(pickerId+"Label")?.textContent||"").trim().toUpperCase();

  // Primero debe elegirse la estructura. No dejamos imágenes sin clasificar.
  if(!PACS.constants.studies.includes(study)){
    const input=document.getElementById(scope==="patient"?"pFiles":"aFiles");
    if(input)input.value="";
    PACS.ui.toast("Selecciona primero una estructura / estudio.");
    return;
  }

  if(scope==="patient")state.patientFiles.push(...arr);
  else state.addFiles.push(...arr);

  // Al pulsar “Abrir” en el explorador, estructura + archivos se convierten
  // inmediatamente en un grupo preparado. No existe un segundo botón intermedio.
  const ok=PACS.app.commitGroup(scope,true);
  if(ok){
    PACS.app.renderGroups(scope);
    PACS.ui.toast(`${study} · ${arr.length} imagen(es) preparada(s).`);
  }
};

/* ===== app.js ===== */
window.PACS = window.PACS || {};
PACS.app = {
  async start(){
    this.bindGlobalEvents();
    this.home();
    PACS.ui.loading(false);

    try{
      await PACS.supabase.init();
      const restored=await PACS.auth.restore();
      if(restored){
        await this.sync();
        this.render();
      }
      // Signed URLs are temporary. Refresh only the study currently being viewed.
      if(!PACS.state._imageRefreshTimer){
        const refreshCurrentImages=()=>{
          if(!PACS.state.logged)return;
          const study=PACS.data.currentStudy();
          if(!study?.images?.length)return;
          PACS.data.hydrateImages(study)
            .then(()=>PACS.app.render())
            .catch(err=>console.error("Automatic image refresh:",err));
        };

        // Renueva las URLs antes de que caduquen (1 hora) mientras la página
        // permanece abierta.
        PACS.state._imageRefreshTimer=setInterval(refreshCurrentImages,45*60*1000);

        // Si el navegador suspende la pestaña/móvil y vuelve después de horas o días,
        // renovar inmediatamente al regresar, sin F5.
        if(!PACS.state._imageVisibilityHandler){
          PACS.state._imageVisibilityHandler=()=>{
            if(document.visibilityState==="visible") refreshCurrentImages();
          };
          document.addEventListener("visibilitychange",PACS.state._imageVisibilityHandler);
        }
      }
    }catch(err){
      console.error("PACS startup:",err);
      const status=document.getElementById("loginStatus");
      if(status)status.textContent="Conexión con Supabase pendiente. Puedes intentar iniciar sesión.";

    <aside id="side" class="side"><div style="display:flex;justify-content:space-between"><b>← PACIENTES</b><button class="close" data-action="side-close">×</button></div><div class="stats-row"><span class="stat-pill"><b>${dayPatients.length}</b> hoy</span><span class="stat-pill"><b>${dayStudies}</b> estudios</span><span class="stat-pill"><b>${totalPatients}</b> total</span></div><input id="mobileSearch" placeholder="🔎 Nombre, estudio o fecha...">${mobileAdd}<div id="mobilePatients" class="patients">${list}</div></aside>`;
    this.renderThumbSync();
    this.applyViewerTransform();
    this.bindMobileControls();
  },
  bindMobileControls(){
    if(!window.matchMedia?.("(max-width: 850px)").matches)return;
    document.querySelectorAll(".mobile-nav button").forEach(btn=>{
      if(btn.dataset.mobileBound==="1")return;
      btn.dataset.mobileBound="1";
      btn.addEventListener("click",()=>{
        this.mobileNavigate(btn.dataset.mobile);
      });
      btn.addEventListener("touchend",e=>{
        e.preventDefault();
        this.mobileNavigate(btn.dataset.mobile);
      },{passive:false});
    });

    const side=document.getElementById("side");
    const overlay=document.getElementById("overlay");
    side?.querySelectorAll("[data-patient]").forEach(btn=>{
      if(btn.dataset.mobilePatientBound==="1")return;
      btn.dataset.mobilePatientBound="1";
      const choose=ev=>{
        ev.preventDefault();
        PACS.patients.select(decodeURIComponent(btn.dataset.patient));
      };
      btn.addEventListener("click",choose);
    });
    const close=document.querySelector('#side [data-action="side-close"]');
    if(side && !side.dataset.mobileBound){
      side.dataset.mobileBound="1";
      close?.addEventListener("click",e=>{e.preventDefault();this.closeSide();});
      overlay?.addEventListener("click",()=>this.closeSide());
    }
  },
  renderThumbSync(){
    // No-op: thumbs are already part of the render() HTML.
  },


  rotateLeft(){
    PACS.state.rotation=(PACS.state.rotation+270)%360;
    this.applyViewerTransform();
  },
  rotateRight(){
    PACS.state.rotation=(PACS.state.rotation+90)%360;
    this.applyViewerTransform();
  },
  toggleInvert(){
    PACS.state.invert=!PACS.state.invert;
    this.applyViewerTransform();
  },
  adjustContrast(delta){
    PACS.state.contrast=Math.max(40,Math.min(200,PACS.state.contrast+delta));
    this.applyViewerTransform();
  },
  adjustWindow(delta){
    // Controls "penetración" / window level without changing the viewer frame.
    PACS.state.windowLevel=Math.max(-100,Math.min(100,PACS.state.windowLevel+delta));
    PACS.state.brightness=Math.max(60,Math.min(160,100+PACS.state.windowLevel*0.4));
    this.applyViewerTransform();
  },
  resetViewer(){
    Object.assign(PACS.state,{
      scale:1,panX:0,panY:0,rotation:0,
      brightness:100,contrast:100,invert:false,windowLevel:0,
      panMode:true,isDraggingImage:false
    });
    this.applyViewerTransform();
  },
  clampPan(){
    const frame=document.getElementById("image");
    if(!frame)return;
    const maxX=frame.clientWidth*1.5;
    const maxY=frame.clientHeight*1.5;
    PACS.state.panX=Math.max(-maxX,Math.min(maxX,PACS.state.panX));
    PACS.state.panY=Math.max(-maxY,Math.min(maxY,PACS.state.panY));
  },
  applyViewerTransform(){
    const img=document.querySelector("#image .xray img");
    if(!img)return;
    this.clampPan();
    const s=PACS.state;
    img.style.transform=`translate(${s.panX}px, ${s.panY}px) scale(${s.scale}) rotate(${s.rotation}deg)`;
    const invert=s.invert?1:0;
    img.style.filter=` brightness(${s.brightness/100}) contrast(${s.contrast/100}) invert(${invert})`;
    img.style.cursor=s.panMode?"grab":"default";
    document.querySelectorAll(".tool[data-tool]").forEach(b=>{
      const active =
        (b.dataset.tool==="pan" && s.panMode) ||
        (b.dataset.tool==="invert" && s.invert);
      b.classList.toggle("active",active);
    });
  },
  viewerZoom(factor,centerX=null,centerY=null){
    const s=PACS.state, old=s.scale;
    const next=Math.max(0.25,Math.min(6,old*factor));
    if(Math.abs(next-old)<0.001)return;
    if(centerX!=null&&centerY!=null){
      const frame=document.getElementById("image");
      const rect=frame?.getBoundingClientRect();
      if(rect){
        const cx=centerX-(rect.left+rect.width/2);
        const cy=centerY-(rect.top+rect.height/2);
        const ratio=(next/old)-1;
        s.panX-=cx*ratio;
        s.panY-=cy*ratio;
      }
    }
    s.scale=next;
    this.applyViewerTransform();
  },
  startImageDrag(e){
    const img=e.target.closest?.("#image .xray img");
    if(!img||!PACS.state.panMode||PACS.state.pinchActive)return;
    e.preventDefault();
    PACS.state.isDraggingImage=true;
    PACS.state.dragStartX=e.clientX; PACS.state.dragStartY=e.clientY;
    PACS.state.panStartX=PACS.state.panX; PACS.state.panStartY=PACS.state.panY;
    try{img.setPointerCapture?.(e.pointerId);}catch(_){}
  },
  moveImageDrag(e){
    if(!PACS.state.isDraggingImage)return;
    const s=PACS.state;
    s.panX=s.panStartX+(e.clientX-s.dragStartX);
    s.panY=s.panStartY+(e.clientY-s.dragStartY);
    this.applyViewerTransform();
  },
  endImageDrag(){PACS.state.isDraggingImage=false;},

  mobileDrawerTouchStart(e){
    if(!window.matchMedia?.("(max-width: 850px)").matches)return;
    const side=document.getElementById("side");
    if(!side?.classList.contains("open"))return;
    const t=e.touches?.[0];
    if(!t || !side.contains(e.target))return;

    PACS.state._drawerSwipe={
      startX:t.clientX,
      startY:t.clientY,
      active:true
    };
  },
  mobileDrawerTouchEnd(e){
    const swipe=PACS.state._drawerSwipe;
    PACS.state._drawerSwipe=null;
    if(!swipe?.active)return;
    if(!window.matchMedia?.("(max-width: 850px)").matches)return;

    const t=e.changedTouches?.[0];
    if(!t)return;

    const dx=t.clientX-swipe.startX;
    const dy=t.clientY-swipe.startY;

    // Solo cerrar con un gesto claramente horizontal hacia la izquierda.
    // Un movimiento vertical normal dentro de la lista no cierra el panel.
    if(dx < -60 && Math.abs(dx) > Math.abs(dy)*1.2){
      this.closeSide();
    }
  },

  touchDistance(touches){
    const a=touches[0], b=touches[1];
    return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
  },
  startPinch(e){
    if(e.touches?.length!==2)return;
    const image=e.target.closest?.("#image");
    if(!image)return;
    e.preventDefault();
    PACS.state.pinchActive=true;
    PACS.state.isDraggingImage=false;
    PACS.state.pinchStartDistance=this.touchDistance(e.touches);
    PACS.state.pinchStartScale=PACS.state.scale;
  },
  movePinch(e){
    if(!PACS.state.pinchActive || e.touches?.length!==2)return;
    e.preventDefault();

    const start=PACS.state.pinchStartDistance||1;
    const factor=this.touchDistance(e.touches)/start;
    const old=PACS.state.scale;
    const next=Math.max(0.25,Math.min(6,PACS.state.pinchStartScale*factor));
    if(Math.abs(next-old)<0.002)return;

    const centerX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const centerY=(e.touches[0].clientY+e.touches[1].clientY)/2;
    const frame=document.getElementById("image");
    const rect=frame?.getBoundingClientRect();

    if(rect){
      const cx=centerX-(rect.left+rect.width/2);
      const cy=centerY-(rect.top+rect.height/2);
      const ratio=(next/old)-1;
      PACS.state.panX-=cx*ratio;
      PACS.state.panY-=cy*ratio;
    }

    PACS.state.scale=next;
    this.applyViewerTransform();
  },
  endPinch(e){
    if(!e.touches || e.touches.length<2){
      PACS.state.pinchActive=false;
    }
  },
  bindGlobalEvents(){
    if(this._eventsBound)return;
    this._eventsBound=true;
    document.addEventListener("click", e=>this.onClick(e));
    document.addEventListener("keydown", e=>this.onKey(e));
    document.addEventListener("input", e=>{
      if(e.target?.id==="topSearch" || e.target?.id==="mobileSearch"){
        PACS.state.searchTerm=e.target.value.trim().toLowerCase();
        document.getElementById("menu")?.classList.remove("show");
        document.getElementById("mobileMoreMenu")?.classList.remove("show");
        this.renderSearchResults(e.target.id==="mobileSearch");
      }
    });
    document.addEventListener("wheel",e=>{
      const image=e.target.closest?.("#image");
      if(!image)return;
      e.preventDefault();
      this.viewerZoom(e.deltaY<0?1.12:0.89,e.clientX,e.clientY);
    },{passive:false});

    document.addEventListener("pointerdown",e=>this.startImageDrag(e));
    document.addEventListener("pointermove",e=>this.moveImageDrag(e));
    document.addEventListener("pointerup",()=>this.endImageDrag());
    document.addEventListener("pointercancel",()=>this.endImageDrag());
    document.addEventListener("touchstart",e=>this.startPinch(e),{passive:false});
    document.addEventListener("touchmove",e=>this.movePinch(e),{passive:false});
    document.addEventListener("touchend",e=>this.endPinch(e),{passive:false});
    document.addEventListener("touchcancel",e=>this.endPinch(e),{passive:false});
    document.addEventListener("touchstart",e=>this.mobileDrawerTouchStart(e),{passive:true});
    document.addEventListener("touchend",e=>this.mobileDrawerTouchEnd(e),{passive:true});

  },
  async onClick(e){
    const calendar=document.getElementById("calendarPopup");
    const clickedInsideDate=e.target.closest?.(".date-wrap");
    if(calendar?.classList.contains("show") && !clickedInsideDate){
      calendar.classList.remove("show");
    }

    const action=e.target.closest?.("[data-action]")?.dataset?.action;
    const patientBtn=e.target.closest?.("[data-patient]")?.dataset?.patient;
    const studyBtn=e.target.closest?.("[data-study-index]");
    const imageBtn=e.target.closest?.("[data-image-index]");
    const tool=e.target.closest?.("[data-tool]")?.dataset?.tool;
    const mobile=e.target.closest?.("[data-mobile]")?.dataset?.mobile;

    // Cerrar desplegables al hacer clic fuera, tanto en PC como en móvil.
    const userMenu=document.getElementById("menu");
    const moreMenu=document.getElementById("mobileMoreMenu");
    const searchResults=document.getElementById("searchResults");
    if(userMenu?.classList.contains("show") && !e.target.closest?.("#menu") && !e.target.closest?.("#userButton")) userMenu.classList.remove("show");
    if(moreMenu?.classList.contains("show") && !e.target.closest?.("#mobileMoreMenu") && !e.target.closest?.(".mobile-more-btn")) moreMenu.classList.remove("show");
    if(searchResults?.innerHTML && !e.target.closest?.(".search-wrap")) searchResults.innerHTML="";
    if(!e.target.closest?.(".study-search-wrap")) document.querySelectorAll(".study-options.show").forEach(x=>x.classList.remove("show"));

    if(patientBtn){ e.preventDefault(); return PACS.patients.select(decodeURIComponent(patientBtn)); }
    if(studyBtn){ e.preventDefault(); return PACS.studies.select(Number(studyBtn.dataset.studyIndex)); }
    if(imageBtn){
      e.preventDefault();
      PACS.state.selectedImage=Number(imageBtn.dataset.imageIndex);
      this.render();
      PACS.data.hydrateImages(PACS.data.currentStudy())
        .then(()=>this.render())
        .catch(err=>console.error("Image hydration:",err));
      return;
    }
    if(tool){
      e.preventDefault();
      if(tool==="zoom-out")this.viewerZoom(0.85);
      else if(tool==="zoom-in")this.viewerZoom(1.18);
      else if(tool==="pan"){PACS.state.panMode=!PACS.state.panMode;this.applyViewerTransform();}
      else if(tool==="rotate-left")this.rotateLeft();
      else if(tool==="rotate-right")this.rotateRight();
      else if(tool==="invert")this.toggleInvert();
      else if(tool==="contrast-down")this.adjustContrast(-10);
      else if(tool==="contrast-up")this.adjustContrast(10);
      else if(tool==="window-down")this.adjustWindow(-10);
      else if(tool==="window-up")this.adjustWindow(10);
      else if(tool==="reset")this.resetViewer();
      return;
    }

    const picker=e.target.closest?.("[data-study-picker]")?.dataset?.studyPicker;
    if(picker){
      e.preventDefault();
      const opts=document.getElementById(picker+"Options");
      if(opts){
        const wasOpen=opts.classList.contains("show");
        document.querySelectorAll(".study-options.show").forEach(x=>{ if(x!==opts) x.classList.remove("show"); });
        if(wasOpen){
          opts.classList.remove("show");
        }else{
          opts.innerHTML=PACS.constants.studies.map(s=>`<button type="button" class="study-option" data-study-choice="${picker}" data-value="${s.replace(/"/g,"&quot;")}">${s}</button>`).join("");
          opts.classList.add("show");
        }
      }
      return;
    }

    const choice=e.target.closest?.("[data-study-choice]");
    if(choice){
      e.preventDefault();
      return this.renderStudyChoice(choice.dataset.studyChoice,choice.dataset.value);
    }

const calDate=e.target.closest?.("[data-calendar-date]")?.dataset?.calendarDate;
    if(calDate){ return PACS.studies.chooseDate(calDate); }
    const step=e.target.closest?.("[data-calendar-step]")?.dataset?.calendarStep;
    if(step){ e.preventDefault(); return this.moveCalendar(Number(step)); }

    if(!action) return;

    e.preventDefault();
    if(action==="login-open")return this.openLogin();
    if(action==="menu-toggle"){
      document.getElementById("mobileMoreMenu")?.classList.remove("show");
      const sr=document.getElementById("searchResults"); if(sr) sr.innerHTML="";
      return document.getElementById("menu")?.classList.toggle("show");
    }
    if(action==="mobile-more-toggle"){
      document.getElementById("menu")?.classList.remove("show");
      document.getElementById("mobileMoreMenu")?.classList.toggle("show");
      return;
    }
    if(action==="logout"){await PACS.auth.logout();return this.home();}
    if(!e.target.closest?.(".mobile-admin-actions")){
      document.getElementById("mobileMoreMenu")?.classList.remove("show");
    }
    if(action==="fullscreen"){document.getElementById("image")?.requestFullscreen?.();return;}
    if(action==="add-patient"){
      // En móvil, cerrar primero el panel lateral de Pacientes para que
      // la ventana "Agregar paciente" quede completamente visible.
      if(window.matchMedia?.("(max-width: 850px)").matches){
        this.closeSide();
      }
      return this.openAddPatient();
    }
    if(action==="edit-patient"){document.getElementById("mobileMoreMenu")?.classList.remove("show");return this.openEditPatient();}
    if(action==="add-images"){document.getElementById("mobileMoreMenu")?.classList.remove("show");return this.openAddImages();}
    if(action==="delete-image"){document.getElementById("mobileMoreMenu")?.classList.remove("show");return this.openDeleteImage();}
    if(action==="delete-patient"){document.getElementById("mobileMoreMenu")?.classList.remove("show");return this.openDeletePatient();}
    if(action==="calendar-toggle")return this.toggleCalendar(e);
    if(action==="side-close")return this.closeSide();
    if(action==="close-patient-modal"){return PACS.ui.closeModal("patientModal");}
    if(action==="close-edit-modal"){return PACS.ui.closeModal("editModal");}
    if(action==="close-images-modal"){return PACS.ui.closeModal("imagesModal");}
    if(action==="close-confirm-modal"){return PACS.ui.closeModal("confirmModal");}
    if(action==="close-login-modal"){return PACS.ui.closeModal("loginModal");}
    if(action==="login-submit")return this.doLogin();
    if(action==="group-remove"){
      const scope=e.target.closest?.("[data-group-scope]")?.dataset?.groupScope;
      const index=Number(e.target.closest?.("[data-group-index]")?.dataset?.groupIndex);
      return this.removeGroup(scope,index);
    }
    if(action==="add-patient-save")return this.savePatient();
    if(action==="edit-save")return this.saveEdit();
    if(action==="images-save")return this.saveImages();
  },
  async doLogin(){
    const email=(document.getElementById("loginEmail")?.value||"").trim();
    const pass=(document.getElementById("loginPass")?.value||"").trim();
    const status=document.getElementById("loginStatus");
    if(!email){if(status)status.textContent="Escribe tu correo.";return;}
    if(!pass){if(status)status.textContent="Escribe tu contraseña.";return;}
    const btn=document.getElementById("loginSubmit"); if(btn)btn.disabled=true;
    try{
      await PACS.auth.login(email,pass);
      const rememberUser=document.getElementById("rememberUser")?.checked;
      if(rememberUser) localStorage.setItem("pacsRememberEmail",email);
      else localStorage.removeItem("pacsRememberEmail");
      // Por seguridad, no guardamos la contraseña en localStorage.
      const rememberPass=document.getElementById("rememberPass");
      if(rememberPass) rememberPass.checked=false;
      PACS.ui.closeModal("loginModal");
      await this.sync();
      this.render();
    }catch(err){if(status)status.textContent=err.message||"No se pudo iniciar sesión.";}
    finally{if(btn)btn.disabled=false;}
  },
  openLogin(){
    PACS.ui.openModal("loginModal");
    document.getElementById("loginStatus").textContent="";
    const savedEmail=localStorage.getItem("pacsRememberEmail")||"";
    const email=document.getElementById("loginEmail");
    const remember=document.getElementById("rememberUser");
    if(email && savedEmail) email.value=savedEmail;
    if(remember) remember.checked=!!savedEmail;
    document.getElementById("loginPass")?.focus();
  },

    document.getElementById("pDni").value="";
    document.getElementById("pSex").value="";

    document.getElementById("pBirth").value="";
    document.getElementById("pStudyDate").textContent=PACS.state.selectedDate;
    PACS.state.patientFiles=[];
    PACS.state.patientGroups=[];
    document.getElementById("patientFiles").innerHTML="";
    this.openStudyPicker("pStudyType");
    this.renderGroups("patient");
    PACS.ui.openModal("patientModal");
  },
  openEditPatient(){
    const p=PACS.state.selectedPatient;

  openAddImages(){

    if(!p)return PACS.ui.toast("Selecciona un paciente primero para realizar esta acción.");

  openDeleteImage(){
    const p=PACS.state.selectedPatient,study=PACS.data.currentStudy();
    if(PACS.state.role!=="admin")return PACS.ui.toast("Solo el Administrador puede eliminar imágenes.");
    if(!p)return PACS.ui.toast("Selecciona un paciente primero para realizar esta acción.");
    if(!study||!study.images.length)return PACS.ui.toast("El estudio seleccionado no tiene imágenes.");
    PACS.ui.openModal("confirmModal");
    document.getElementById("confirmTitle").textContent="ELIMINAR IMAGEN";
    document.getElementById("confirmText").textContent=`¿Deseas eliminar la imagen ${PACS.state.selectedImage||1} del estudio ${study.study}?`;
    document.getElementById("confirmBtn").onclick=async()=>{
      PACS.ui.closeModal("confirmModal");
      const index=Math.max(0,Math.min(study.images.length-1,(PACS.state.selectedImage||1)-1));
      const backup=study.images.slice();
      const deleted=study.images.splice(index,1)[0];
      PACS.state.selectedImage=study.images.length?Math.min(index+1,study.images.length):0;
      this.render();
      try{
        // Primero actualizamos la BD para que nunca quede una referencia a un archivo ya borrado.
        const {error}=await PACS.state.client.from("studies").update({images:study.images}).eq("id",study.id);
        if(error)throw error;
        try{
          await PACS.images.removeItem(deleted);
        }catch(storageErr){
          // La referencia ya fue quitada de la BD; el archivo puede quedar como residuo en Storage.
          PACS.images.revoke([deleted]);
          PACS.ui.toast("Imagen quitada del estudio, pero no se pudo limpiar el archivo de Storage.");
          console.error("Storage cleanup:",storageErr);
          return;
        }
        PACS.images.revoke([deleted]);

        // Re-sincronizar desde Supabase para que la interfaz quede inmediatamente
        // alineada con la base de datos, sin necesidad de F5.
        const patientId=p.id;
        const studyId=study.id;
        await PACS.data.loadStudies();
        PACS.state.selectedPatient=PACS.data.findPatient(patientId)||null;
        const refreshedStudy=PACS.state.selectedPatient?.studies?.findIndex(s=>s.id===studyId)??-1;
        PACS.state.selectedStudyIndex=refreshedStudy>=0?refreshedStudy:0;
        const refreshedCurrent=PACS.data.currentStudy();
        PACS.state.selectedImage=PACS.data.studyCount(refreshedCurrent)>0
          ?Math.min(Math.max(1,index+1),PACS.data.studyCount(refreshedCurrent)):0;
        await PACS.data.hydrateImages(refreshedCurrent);
        this.render();
        PACS.ui.toast("Imagen eliminada correctamente.");
      }catch(err){
        study.images=backup; PACS.state.selectedImage=index+1; this.render();
        PACS.ui.toast(err.message||"No se pudo eliminar la imagen.");
      }
    };
  },
  openDeletePatient(){
    const p=PACS.state.selectedPatient;
    if(PACS.state.role!=="admin")return PACS.ui.toast("Solo el Administrador puede eliminar pacientes.");
    if(!p)return PACS.ui.toast("Selecciona un paciente primero para realizar esta acción.");
    PACS.ui.openModal("confirmModal");
    document.getElementById("confirmTitle").textContent="ELIMINAR PACIENTE";
    document.getElementById("confirmText").textContent=`¿Deseas eliminar al paciente ${p.name}?`;
    document.getElementById("confirmBtn").onclick=async()=>{
      PACS.ui.closeModal("confirmModal");
      const backup=PACS.state.patients.slice();
      PACS.state.patients=PACS.state.patients.filter(x=>x.id!==p.id);
      PACS.state.selectedPatient=null;
      PACS.state.selectedStudyIndex=0;
      PACS.state.selectedImage=0;
      this.render();

      // IMPORTANTE: desde aquí diferenciamos el resultado de la eliminación
      // del refresco de la interfaz. Si la BD ya eliminó al paciente, un fallo
      // posterior de Storage o de la recarga NO debe devolverlo a la pantalla.
      let deletedFromDatabase=false;
      try{
        const imageItems=p.studies.flatMap(s=>PACS.data.imageItems(s));
        const paths=imageItems.map(PACS.data.imagePath).filter(Boolean);

        const {error}=await PACS.state.client
          .from("studies")
          .delete()
          .eq("patient",p.name);
        if(error)throw error;
        deletedFromDatabase=true;

        // Storage es limpieza secundaria: un fallo aquí no revierte la eliminación
        // de la base de datos ni vuelve a mostrar al paciente.
        const failures=await PACS.images.removeItems(imageItems);
        if(failures.length){
          console.warn("Archivos que no pudieron eliminarse de Storage:",failures);
          PACS.ui.toast(`Paciente eliminado. ${failures.length} archivo(s) quedaron pendientes de limpieza en Storage.`);
        }else{
          PACS.ui.toast(paths.length
            ?"Paciente y todas sus imágenes eliminados correctamente."
            :"Paciente eliminado correctamente.");
        }

        // Refresco separado. Si falla, mantenemos la eliminación local ya aplicada.
        try{
          await PACS.data.loadStudies();
          PACS.state.selectedPatient=null;
          PACS.state.selectedStudyIndex=0;
          PACS.state.selectedImage=0;
          this.render();
        }catch(refreshErr){
          console.error("PACS: no se pudo refrescar la lista después de eliminar:",refreshErr);
          // No restauramos al paciente: ya fue eliminado de Supabase.
          PACS.state.selectedPatient=null;
          PACS.state.selectedStudyIndex=0;
          PACS.state.selectedImage=0;
          this.render();
          PACS.ui.toast("Paciente eliminado. La lista se actualizará al volver a cargar.");
        }
      }catch(err){
        if(!deletedFromDatabase){
          PACS.state.patients=backup;
          PACS.state.selectedPatient=p;
          this.render();
          PACS.ui.toast(err.message||"No se pudo eliminar el paciente.");
        }else{
          // Seguridad: si la BD confirmó la eliminación, nunca restauramos el paciente.
          PACS.state.selectedPatient=null;
          this.render();
          PACS.ui.toast("Paciente eliminado, pero ocurrió un problema al actualizar la interfaz.");
        }
      }
    };
  },
  openStudyPicker(id,selected=""){
    const wrap=document.getElementById(id);
    if(!wrap)return;
    const value=selected||"";
    wrap.innerHTML=`<div class="study-search-wrap"><button type="button" class="study-picker-btn" data-study-picker="${id}"><span id="${id}Label">${value||"SELECCIONA ESTRUCTURA / ESTUDIO"}</span><span class="study-picker-arrow">▾</span></button><div class="study-options" id="${id}Options"></div></div><div class="study-selected" id="${id}Selected">${value?"ESTRUCTURA SELECCIONADA: "+value:"SELECCIONAR ESTRUCTURA / ESTUDIO"}</div>`;
  },
  groupConfig(scope){
    return scope==="patient"
      ?{groups:"patientGroups",files:"patientFiles",picker:"pStudyType",list:"patientGroups",input:"pFiles"}
      :{groups:"addGroups",files:"addFiles",picker:"aStudyType",list:"addGroups",input:"aFiles"};
  },
  renderPendingFiles(scope){
    const c=this.groupConfig(scope), list=PACS.state[c.files]||[], el=document.getElementById(c.files);
    if(el) el.innerHTML=list.map(f=>`<div class="file-row"><span>🖼️ ${String(f.name).replace(/</g,"&lt;")}</span><span>${Math.max(1,Math.round((f.size||0)/1024))} KB</span></div>`).join("");
  },
  renderGroups(scope){
    const c=this.groupConfig(scope), groups=PACS.state[c.groups]||[], el=document.getElementById(c.list);
    if(!el)return;
    if(!groups.length){el.innerHTML='<div class="group-empty">Aún no hay estructuras preparadas.</div>';return;}
    el.innerHTML=groups.map((g,i)=>`<div class="group-card" data-group-scope="${scope}" data-group-index="${i}"><div class="group-card-main"><b>${g.study}</b><span>${g.files.length} imagen(es) · ${g.files.map(f=>String(f.name)).join(", ")}</span></div><button type="button" class="group-remove" data-action="group-remove" title="Quitar grupo">×</button></div>`).join("");
  },
  commitGroup(scope,resetPicker=true){
    const c=this.groupConfig(scope);
    const study=(document.getElementById(c.picker+"Label")?.textContent||"").trim().toUpperCase();
    const files=(PACS.state[c.files]||[]).slice();
    if(!PACS.constants.studies.includes(study)){PACS.ui.toast("Selecciona una estructura / estudio.");return false;}
    if(!files.length){PACS.ui.toast("Selecciona al menos una imagen para esta estructura.");return false;}
    const groups=PACS.state[c.groups];
    const existing=groups.find(g=>g.study===study);
    if(existing)existing.files.push(...files); else groups.push({study,files});
    PACS.state[c.files]=[];
    const input=document.getElementById(c.input); if(input)input.value="";
    this.renderPendingFiles(scope);
    this.renderGroups(scope);
    if(resetPicker)this.openStudyPicker(c.picker);
    return true;
  },
  removeGroup(scope,index){
    const c=this.groupConfig(scope);
    if(!Number.isInteger(index)||index<0)return;
    PACS.state[c.groups].splice(index,1);
    this.renderGroups(scope);
  },
  commitPendingIfAny(scope){
    const c=this.groupConfig(scope);
    const files=PACS.state[c.files]||[];
    if(!files.length)return true;
    return this.commitGroup(scope,false);
  },
  async appendFilesToStudy(study,files){
    const backup=study.images.slice();
    const previews=files.map(PACS.images.localPreview);
    study.images.push(...previews);
    try{
      const uploaded=await PACS.images.uploadForStudy(study.id,files);
      const next=[...backup,...uploaded];
      const {error}=await PACS.state.client.from("studies").update({images:next}).eq("id",study.id);
      if(error)throw error;
      PACS.images.revoke(previews);
      study.images=next;
    }catch(err){
      PACS.images.revoke(previews);
      study.images=backup;
      throw err;
    }
  },
  async savePatient(){
    const name=document.getElementById("pName")?.value.trim().toUpperCase();
    if(!name)return PACS.ui.toast("El nombre del paciente es obligatorio.");
    if(!this.commitPendingIfAny("patient"))return;
    const groups=PACS.state.patientGroups.slice();
    if(!groups.length)return PACS.ui.toast("Agrega al menos una estructura con imágenes.");
    const sex=document.getElementById("pSex")?.value||"";
    const btn=document.querySelector('[data-action="add-patient-save"]');
    if(btn)btn.disabled=true;
    try{
      let created=null;
      for(const g of groups){
        created=await PACS.patients.add({name,study:g.study,date:PACS.state.selectedDate,files:g.files,sex});
      }
      await PACS.data.loadStudies();
      const refreshed=PACS.state.patients.find(p=>p.name===name)||created||null;
      PACS.state.selectedPatient=refreshed;
      if(refreshed){
        const lastStudy=groups[groups.length-1].study;
        const idx=refreshed.studies.findIndex(s=>s.date===PACS.state.selectedDate&&s.study===lastStudy);
        PACS.state.selectedStudyIndex=idx>=0?idx:0;
        PACS.state.selectedImage=PACS.data.studyCount(PACS.data.currentStudy())>0?1:0;
        await PACS.data.hydrateImages(PACS.data.currentStudy());
      }
      PACS.state.patientGroups=[]; PACS.state.patientFiles=[];
      this.render();
      PACS.ui.closeModal("patientModal");
      PACS.ui.toast(`${groups.length} estructura(s) guardadas correctamente.`);
    }catch(err){
      console.error("PACS: error al agregar paciente por estructuras:",err);
      PACS.ui.toast(err?.message||"No se pudo completar el registro del paciente.");
    }finally{if(btn)btn.disabled=false;}
  },
  async saveEdit(){
    const newName=document.getElementById("eName").value.trim().toUpperCase();
    const newSex=document.getElementById("eSex").value.trim().toUpperCase();
    try{
      await PACS.patients.updateName(newName,newSex);
      PACS.ui.closeModal("editModal");
    }catch(err){
      PACS.ui.toast(err.message||"No se pudo modificar el paciente.");
    }
  },
  async saveImages(){
    const p=PACS.state.selectedPatient;
    const current=PACS.data.currentStudy();
    if(!p||!current)return PACS.ui.toast("Selecciona un paciente y estudio primero.");
    if(!this.commitPendingIfAny("add"))return;
    const groups=PACS.state.addGroups.slice();
    if(!groups.length)return PACS.ui.toast("Agrega al menos una estructura con imágenes.");
    const date=document.getElementById("aStudyDate")?.value||current.date;
    const btn=document.querySelector('[data-action="images-save"]');
    if(btn)btn.disabled=true;
    try{
      for(const g of groups){
        let target=p.studies.find(s=>s.date===date&&String(s.study).toUpperCase()===g.study);
        if(target){
          await this.appendFilesToStudy(target,g.files);
        }else{
          await PACS.patients.add({name:p.name,study:g.study,date,files:g.files,sex:p.sex||""});
          target=PACS.data.currentStudy();
        }
      }
      const patientName=p.name;
      await PACS.data.loadStudies();
      const refreshed=PACS.state.patients.find(x=>x.name===patientName)||null;
      PACS.state.selectedPatient=refreshed;
      if(refreshed){
        const last=groups[groups.length-1].study;
        const idx=refreshed.studies.findIndex(s=>s.date===date&&String(s.study).toUpperCase()===last);
        PACS.state.selectedStudyIndex=idx>=0?idx:0;
        PACS.state.selectedImage=PACS.data.studyCount(PACS.data.currentStudy())>0?1:0;
        await PACS.data.hydrateImages(PACS.data.currentStudy());
      }
      PACS.state.addGroups=[]; PACS.state.addFiles=[];
      this.render();
      PACS.ui.closeModal("imagesModal");
      PACS.ui.toast(`${groups.length} estructura(s) actualizadas correctamente.`);
    }catch(err){
      console.error("PACS: error al guardar imágenes por estructuras:",err);
      PACS.ui.toast(err?.message||"No se pudieron guardar todas las imágenes.");
    }finally{if(btn)btn.disabled=false;}
  },
  renderStudyChoice(id,value){
    const scope=id==="pStudyType"?"patient":(id==="aStudyType"?"add":"");
    const c=scope?this.groupConfig(scope):null;
    const oldValue=(document.getElementById(id+"Label")?.textContent||"").trim().toUpperCase();
    if(scope && PACS.state[c.files]?.length && PACS.constants.studies.includes(oldValue) && oldValue!==String(value).toUpperCase()){
      this.commitGroup(scope,false);
    }
    const label=document.getElementById(id+"Label");
    if(label)label.textContent=value;
    const s=document.getElementById(id+"Selected");
    if(s)s.textContent="ESTRUCTURA SELECCIONADA: "+value;
    document.getElementById(id+"Options")?.classList.remove("show");
  },
  toggleCalendar(e){
    e?.stopPropagation();
    const popup=document.getElementById("calendarPopup");
    if(!popup)return;
    popup.classList.toggle("show");
    if(popup.classList.contains("show"))this.drawCalendar();
  },
  drawCalendar(){
    const popup=document.getElementById("calendarPopup"); if(!popup)return;
    const [d,mon,y]=PACS.state.selectedDate.split(" ");
    let month=PACS.constants.months.findIndex(m=>m.startsWith(mon)); if(month<0)month=7;
    const year=Number(y)||new Date().getFullYear();
    const first=new Date(year,month,1), start=(first.getDay()+6)%7;
    const days=new Date(year,month+1,0).getDate();
    let html="";
    PACS.constants.weekdays.forEach(w=>html+=`<div class="cal-week">${w}</div>`);
    for(let i=0;i<42;i++){
      const day=i-start+1; if(day<1||day>days){html+=`<div class="cal-day muted-day"></div>`;continue;}
      const label=`${String(day).padStart(2,"0")} ${PACS.constants.months[month].slice(0,3)} ${year}`;
      const selected=label===PACS.state.selectedDate;
      const has=PACS.data.patientsForDate(label).length>0;
      html+=`<button type="button" class="cal-day ${selected?"selected":""} ${has?"has-study":""}" data-calendar-date="${label}">${day}</button>`;
    }
    popup.innerHTML=`<div class="cal-head"><button class="cal-nav" data-calendar-step="-1">‹</button><div class="cal-title">${PACS.constants.months[month]} ${year}</div><button class="cal-nav" data-calendar-step="1">›</button></div><div class="cal-grid">${html}</div>`;
  },
  moveCalendar(delta){
    const popup=document.getElementById("calendarPopup");
    if(!popup)return;
    const [d,mon,y]=PACS.state.selectedDate.split(" ");
    let month=PACS.constants.months.findIndex(m=>m.startsWith(mon)); if(month<0)month=7;
    let year=Number(y)||new Date().getFullYear();
    month+=delta;
    if(month<0){month=11;year--;} if(month>11){month=0;year++;}
    const old=PACS.state.selectedDate;
    const temp=`01 ${PACS.constants.months[month].slice(0,3)} ${year}`;
    PACS.state.selectedDate=temp;
    this.drawCalendar();
    PACS.state.selectedDate=old;
  },
  mobileNavigate(which){
    document.querySelectorAll(".mobile-nav button").forEach(b=>b.classList.remove("active"));
    document.querySelector(`.mobile-nav button[data-mobile="${which}"]`)?.classList.add("active");

    if(which==="patients"){
      const side=document.getElementById("side");
      const overlay=document.getElementById("overlay");
      side?.classList.add("open");
      overlay?.classList.add("show");
      document.body.classList.add("drawer-open");
      return;
    }

    this.closeSide();
    if(which==="viewer"){
      document.getElementById("image")?.scrollIntoView({behavior:"smooth",block:"start"});
      return;
    }
    window.scrollTo({top:0,behavior:"smooth"});
  },
  closeSide(){
    document.getElementById("side")?.classList.remove("open");
    document.getElementById("overlay")?.classList.remove("show");
    document.body.classList.remove("drawer-open");
  },
  async onKey(e){
    if(e.key==="Escape"){PACS.ui.closeAll();return;}
    if(e.key==="Enter" && document.getElementById("loginModal")?.classList.contains("show")){
      if(e.target?.tagName?.toLowerCase()==="input"){e.preventDefault();await this.doLogin();}
    }
  }
};


</script>
<script>
Promise.resolve(window.PACS.app.start()).finally(()=>{
  document.body.classList.remove("auth-booting");
});
</script>

document.addEventListener("change",function(e){
  if(e.target && e.target.name==="pSexChoice"){
    const target=document.getElementById("pSex");
    if(target) target.value=e.target.value;
  }
});
</script>
