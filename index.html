```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PACS Rayos X - HSMP</title>


    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111111;
            color: #eeeeee;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        header {

            height: 80px;

            background: #181818;

            border-bottom: 1px solid #333333;

            display: flex;

            align-items: center;

            padding: 0 20px;
        }


        /* ESPACIO PARA LOGO */

        .logo {

            width: 170px;

            height: 58px;

            border: 1px dashed #555555;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #777777;

            font-size: 12px;

            margin-right: 20px;

            overflow: hidden;
        }


        .logo img {

            width: 100%;

            height: 100%;

            object-fit: contain;
        }


        /* TÍTULO */

        .titulo {

            flex: 1;
        }


        .titulo h1 {

            margin: 0;

            font-size: 21px;

            font-weight: 500;
        }


        .titulo span {

            color: #888888;

            font-size: 12px;
        }


        /* =====================================================
           CONTENEDOR PRINCIPAL
        ===================================================== */

        .contenedor {

            display: flex;

            height: calc(100vh - 80px);
        }


        /* =====================================================
           PANEL DE PACIENTES
        ===================================================== */

        .pacientes {

            width: 280px;

            background: #1b1b1b;

            border-right: 1px solid #333333;

            overflow-y: auto;
        }


        .titulo-panel {

            padding: 15px;

            border-bottom: 1px solid #333333;

            font-size: 13px;

            color: #aaaaaa;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        .paciente {

            padding: 14px 16px;

            border-bottom: 1px solid #292929;

            cursor: pointer;

            transition: 0.2s;
        }


        .paciente:hover {

            background: #252525;
        }


        .paciente.activo {

            background: #303030;

            border-left: 4px solid #999999;
        }


        .nombre-paciente {

            font-size: 15px;

            margin-bottom: 6px;
        }


        .detalle-paciente {

            color: #888888;

            font-size: 12px;
        }


        /* =====================================================
           PANEL DE ESTUDIOS
        ===================================================== */

        .estudios {

            width: 280px;

            background: #151515;

            border-right: 1px solid #333333;

            overflow-y: auto;
        }


        .estudio {

            padding: 14px;

            border-bottom: 1px solid #292929;

            cursor: pointer;
        }


        .estudio:hover {

            background: #222222;
        }


        .estudio.activo {

            background: #2c2c2c;
        }


        .estudio-nombre {

            font-size: 14px;

            margin-bottom: 6px;
        }


        .estudio-fecha {

            color: #777777;

            font-size: 11px;
        }


        /* =====================================================
           VISOR
        ===================================================== */

        .visor {

            flex: 1;

            background: #050505;

            display: flex;

            flex-direction: column;

            min-width: 0;
        }


        /* INFORMACIÓN DEL ESTUDIO */

        .info-estudio {

            height: 55px;

            background: #151515;

            border-bottom: 1px solid #333333;

            display: flex;

            align-items: center;

            padding: 0 18px;
        }


        .info-estudio strong {

            font-size: 14px;
        }


        .info-estudio span {

            margin-left: 15px;

            color: #777777;

            font-size: 12px;
        }


        /* =====================================================
           ÁREA DE IMAGEN
        ===================================================== */

        .area-imagen {

            flex: 1;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        .imagen-principal {

            max-width: 90%;

            max-height: 88%;

            object-fit: contain;

            display: block;

            cursor: zoom-in;
        }


        .sin-imagen {

            color: #555555;

            font-size: 15px;

            text-align: center;
        }


        /* =====================================================
           BARRA INFERIOR
        ===================================================== */

        .controles {

            height: 70px;

            background: #151515;

            border-top: 1px solid #333333;

            display: flex;

            align-items: center;

            padding: 10px;

            gap: 8px;
        }


        .boton {

            background: #292929;

            border: 1px solid #444444;

            color: #dddddd;

            padding: 9px 13px;

            border-radius: 4px;

            cursor: pointer;
        }


        .boton:hover {

            background: #383838;
        }


        /* =====================================================
           MINIATURAS
        ===================================================== */

        .miniaturas {

            flex: 1;

            display: flex;

            gap: 8px;

            overflow-x: auto;

            padding: 3px;
        }


        .miniatura {

            width: 60px;

            height: 50px;

            object-fit: cover;

            border: 2px solid #444444;

            cursor: pointer;

            background: #000000;
        }


        .miniatura.activa {

            border-color: #aaaaaa;
        }


        /* =====================================================
           VISOR DE PANTALLA COMPLETA
        ===================================================== */

        .pantalla-completa {

            position: fixed;

            inset: 0;

            background: #000000;

            z-index: 999;

            display: none;

            align-items: center;

            justify-content: center;
        }


        .pantalla-completa img {

            max-width: 95%;

            max-height: 95%;

            object-fit: contain;
        }


        .cerrar {

            position: absolute;

            top: 20px;

            right: 25px;

            font-size: 30px;

            color: white;

            cursor: pointer;
        }


        /* =====================================================
           ADAPTACIÓN PARA PANTALLAS PEQUEÑAS
        ===================================================== */

        @media (max-width: 900px) {

            .pacientes {

                width: 210px;
            }


            .estudios {

                width: 220px;
            }

        }


        @media (max-width: 700px) {

            body {

                overflow: auto;
            }


            .contenedor {

                height: auto;

                min-height: calc(100vh - 80px);
            }


            .pacientes {

                width: 180px;
            }


            .estudios {

                width: 200px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         ENCABEZADO
    ===================================================== -->

    <header>


        <!-- ESPACIO PARA LOGO -->

        <div class="logo">

            LOGO / IMAGEN

        </div>


        <!-- TÍTULO -->

        <div class="titulo">

            <h1>
                PACS RAYOS X - HSMP
            </h1>

            <span>
                Sistema de visualización de imágenes radiológicas
            </span>

        </div>


    </header>


    <!-- =====================================================
         CONTENEDOR PRINCIPAL
    ===================================================== -->

    <div class="contenedor">


        <!-- =================================================
             PACIENTES
        ================================================== -->

        <aside class="pacientes">


            <div class="titulo-panel">

                Pacientes

            </div>


            <div id="listaPacientes">

            </div>


        </aside>



        <!-- =================================================
             ESTUDIOS
        ================================================== -->

        <aside class="estudios">


            <div class="titulo-panel">

                Estudios

            </div>


            <div id="listaEstudios">

            </div>


        </aside>



        <!-- =================================================
             VISOR
        ================================================== -->

        <main class="visor">


            <!-- INFORMACIÓN -->

            <div class="info-estudio">


                <strong id="nombreEstudio">

                    Seleccione un estudio

                </strong>


                <span id="infoImagen">

                </span>


            </div>



            <!-- ÁREA DE IMAGEN -->

            <div class="area-imagen">


                <div
                    class="sin-imagen"
                    id="mensaje">

                    Seleccione un paciente y un estudio

                </div>


                <img
                    id="imagenPrincipal"
                    class="imagen-principal"
                    style="display:none;"
                    alt="Imagen radiológica">


            </div>



            <!-- CONTROLES -->

            <div class="controles">


                <button
                    class="boton"
                    onclick="imagenAnterior()">

                    ◀

                </button>


                <div
                    class="miniaturas"
                    id="miniaturas">

                </div>


                <button
                    class="boton"
                    onclick="imagenSiguiente()">

                    ▶

                </button>


                <button
                    class="boton"
                    onclick="pantallaCompleta()">

                    ⛶

                </button>


            </div>


        </main>


    </div>



    <!-- =====================================================
         PANTALLA COMPLETA
    ===================================================== -->

    <div
        class="pantalla-completa"
        id="visorCompleto">


        <div
            class="cerrar"
            onclick="cerrarPantallaCompleta()">

            ×

        </div>


        <img
            id="imagenCompleta"
            alt="Imagen ampliada">


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>


        /* =================================================
           DATOS DE PRUEBA

           AQUÍ SE DEFINEN:

           PACIENTE
           ↓
           ESTUDIOS
           ↓
           IMÁGENES
        ================================================= */


        const pacientes = [


            /* =============================================
               PACIENTE 1
            ============================================= */

            {

                nombre: "Juan Pérez",

                historia: "HC-0001",


                estudios: [

                    {

                        nombre: "Radiografía de tórax",

                        fecha: "11/08/2026",


                        imagenes: [

                            "images.jfif",

                            "images (2).jfif"

                        ]

                    }

                ]

            },



            /* =============================================
               PACIENTE 2
            ============================================= */

            {

                nombre: "María López",

                historia: "HC-0002",


                estudios: [

                    {

                        nombre: "Radiografía de columna",

                        fecha: "11/08/2026",


                        imagenes: [

                            "images.jfif"

                        ]

                    }

                ]

            },



            /* =============================================
               PACIENTE 3
            ============================================= */

            {

                nombre: "Carlos Ruiz",

                historia: "HC-0003",


                estudios: [

                    {

                        nombre: "Radiografía de cráneo",

                        fecha: "11/08/2026",


                        imagenes: [

                            "images (2).jfif"

                        ]

                    }

                ]

            }


        ];



        /* =================================================
           VARIABLES
        ================================================= */

        let pacienteActual = 0;

        let estudioActual = 0;

        let imagenActual = 0;



        /* =================================================
           MOSTRAR PACIENTES
        ================================================= */

        function mostrarPacientes() {


            const lista =

                document.getElementById(
                    "listaPacientes"
                );


            lista.innerHTML = "";


            pacientes.forEach(
                (paciente, index) => {


                    const elemento =

                        document.createElement(
                            "div"
                        );


                    elemento.className =
                        "paciente";


                    if (
                        index ===
                        pacienteActual
                    ) {

                        elemento.classList.add(
                            "activo"
                        );

                    }


                    elemento.innerHTML = `

                        <div class="nombre-paciente">

                            ${paciente.nombre}

                        </div>


                        <div class="detalle-paciente">

                            ${paciente.historia}

                            ·

                            ${paciente.estudios.length}

                            estudio(s)

                        </div>

                    `;


                    elemento.onclick =
                        function () {


                            pacienteActual =
                                index;


                            estudioActual =
                                0;


                            imagenActual =
                                0;


                            mostrarPacientes();

                            mostrarEstudios();

                            mostrarImagen();


                        };


                    lista.appendChild(
                        elemento
                    );


                }
            );

        }



        /* =================================================
           MOSTRAR ESTUDIOS
        ================================================= */

        function mostrarEstudios() {


            const lista =

                document.getElementById(
                    "listaEstudios"
                );


            lista.innerHTML = "";


            const paciente =

                pacientes[
                    pacienteActual
                ];


            paciente.estudios.forEach(
                (estudio, index) => {


                    const elemento =

                        document.createElement(
                            "div"
                        );


                    elemento.className =
                        "estudio";


                    if (
                        index ===
                        estudioActual
                    ) {

                        elemento.classList.add(
                            "activo"
                        );

                    }


                    elemento.innerHTML = `

                        <div class="estudio-nombre">

                            ${estudio.nombre}

                        </div>


                        <div class="estudio-fecha">

                            ${estudio.fecha}

                            ·

                            ${estudio.imagenes.length}

                            imagen(es)

                        </div>

                    `;


                    elemento.onclick =
                        function () {


                            estudioActual =
                                index;


                            imagenActual =
                                0;


                            mostrarEstudios();

                            mostrarImagen();


                        };


                    lista.appendChild(
                        elemento
                    );


                }
            );

        }



        /* =================================================
           MOSTRAR IMAGEN
        ================================================= */

        function mostrarImagen() {


            const paciente =

                pacientes[
                    pacienteActual
                ];


            const estudio =

                paciente.estudios[
                    estudioActual
                ];


            const imagen =

                document.getElementById(
                    "imagenPrincipal"
                );


            const mensaje =

                document.getElementById(
                    "mensaje"
                );


            const titulo =

                document.getElementById(
                    "nombreEstudio"
                );


            const info =

                document.getElementById(
                    "infoImagen"
                );


            const miniaturas =

                document.getElementById(
                    "miniaturas"
                );



            titulo.textContent =

                paciente.nombre +
                " — " +
                estudio.nombre;



            info.textContent =

                "Imagen " +

                (imagenActual + 1) +

                " de " +

                estudio.imagenes.length;



            if (
                estudio.imagenes.length === 0
            ) {


                imagen.style.display =
                    "none";


                mensaje.style.display =
                    "block";


                mensaje.textContent =

                    "Este estudio no tiene imágenes.";


                return;

            }



            const ruta =

                estudio.imagenes[
                    imagenActual
                ];



            imagen.src = ruta;


            imagen.style.display =
                "block";


            mensaje.style.display =
                "none";



            /* MINIATURAS */

            miniaturas.innerHTML = "";



            estudio.imagenes.forEach(
                (rutaImagen, index) => {


                    const miniatura =

                        document.createElement(
                            "img"
                        );


                    miniatura.src =
                        rutaImagen;


                    miniatura.className =
                        "miniatura";


                    if (
                        index ===
                        imagenActual
                    ) {

                        miniatura.classList.add(
                            "activa"
                        );

                    }


                    miniatura.onclick =
                        function () {


                            imagenActual =
                                index;


                            mostrarImagen();


                        };


                    miniaturas.appendChild(
                        miniatura
                    );


                }
            );

        }



        /* =================================================
           IMAGEN ANTERIOR
        ================================================= */

        function imagenAnterior() {


            const estudio =

                pacientes[
                    pacienteActual
                ]
                .estudios[
                    estudioActual
                ];


            if (
                estudio.imagenes.length === 0
            ) {

                return;

            }


            imagenActual--;


            if (
                imagenActual < 0
            ) {


                imagenActual =

                    estudio.imagenes.length - 1;

            }


            mostrarImagen();

        }



        /* =================================================
           IMAGEN SIGUIENTE
        ================================================= */

        function imagenSiguiente() {


            const estudio =

                pacientes[
                    pacienteActual
                ]
                .estudios[
                    estudioActual
                ];


            if (
                estudio.imagenes.length === 0
            ) {

                return;

            }


            imagenActual++;


            if (
                imagenActual >=
                estudio.imagenes.length
            ) {


                imagenActual = 0;

            }


            mostrarImagen();

        }



        /* =================================================
           PANTALLA COMPLETA
        ================================================= */

        function pantallaCompleta() {


            const imagen =

                document.getElementById(
                    "imagenPrincipal"
                );


            const visor =

                document.getElementById(
                    "visorCompleto"
                );


            const imagenCompleta =

                document.getElementById(
                    "imagenCompleta"
                );


            if (
                imagen.style.display ===
                "none"
            ) {

                return;

            }


            imagenCompleta.src =
                imagen.src;


            visor.style.display =
                "flex";

        }



        /* =================================================
           CERRAR PANTALLA COMPLETA
        ================================================= */

        function cerrarPantallaCompleta() {


            document

                .getElementById(
                    "visorCompleto"
                )

                .style.display =
                    "none";

        }



        /* =================================================
           INICIAR SISTEMA
        ================================================= */

        mostrarPacientes();

        mostrarEstudios();

        mostrarImagen();


    </script>


</body>

</html>
```
