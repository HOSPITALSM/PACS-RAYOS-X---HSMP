<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PACS — Hospital San Martin de Pangoa</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="appLoading" class="app-loading">Cargando PACS…</div>

<div id="root"></div>

<div id="patientModal" class="modal-bg"><div class="modal">
<div class="mh"><b id="patientModalTitle">AGREGAR PACIENTE</b><button class="close" data-action="close-patient-modal">×</button></div>
<div class="form-grid">
<div class="field name-field"><label>NOMBRE COMPLETO</label><input id="pName" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" placeholder="NOMBRE Y APELLIDOS" autocomplete="off"></div>
<div class="field"><label>DNI <span class="optional">(OPCIONAL)</span></label><input id="pDni" inputmode="numeric" maxlength="8" placeholder="DNI"></div>
<div class="field"><label>SEXO <span class="optional">(OPCIONAL)</span></label><select id="pSex"><option value="">NO ESPECIFICADO</option><option value="M">MASCULINO</option><option value="F">FEMENINO</option></select></div>
<div class="field"><label>FECHA DE NACIMIENTO <span class="optional">(OPCIONAL)</span></label><input id="pBirth" type="date"></div>
<div class="field"><label>FECHA DEL ESTUDIO</label><div class="muted" id="pStudyDate">14 AGO 2026</div></div>
<div class="field study-field"><label>ESTRUCTURA / ESTUDIO</label><div id="pStudyType"></div></div>
<div class="field full"><label>IMÁGENES</label>
<div class="dropzone" id="pDrop" onclick="document.getElementById('pFiles').click()"><b>📎 SELECCIONAR IMÁGENES</b><span>O ARRASTRA UNA O VARIAS IMÁGENES AQUÍ</span></div>
<input id="pFiles" type="file" accept="image/*,.dcm" multiple hidden onchange="handleFiles(this.files,'patientFiles')"><div class="file-list" id="patientFiles"></div></div>
</div>
<div class="modal-actions"><button class="secondary" data-action="close-patient-modal">CANCELAR</button><button class="btn" data-action="add-patient-save">AGREGAR PACIENTE</button></div>
</div></div>

<div id="editModal" class="modal-bg"><div class="modal">
<div class="mh"><b>MODIFICAR PACIENTE</b><button class="close" data-action="close-edit-modal">×</button></div>
<div class="form-grid">
<div class="field full">
<label>NOMBRE COMPLETO</label>
<input id="eName" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" autocomplete="off">
</div>
<div class="field">
<label>DNI <span class="optional">(OPCIONAL)</span></label>
<input id="eDni" inputmode="numeric" maxlength="8" placeholder="SIN MODIFICAR">
</div>
<div class="field">
<label>SEXO <span class="optional">(OPCIONAL)</span></label>
<select id="eSex">
<option value="">NO MODIFICAR</option>
<option value="M">MASCULINO</option>
<option value="F">FEMENINO</option>
</select>
</div>
<div class="field">
<label>FECHA DE NACIMIENTO <span class="optional">(OPCIONAL)</span></label>
<input id="eBirth" type="date">
</div>
</div>
<div class="modal-actions">
<button class="secondary" data-action="close-edit-modal">CANCELAR</button>
<button class="btn" data-action="edit-save">GUARDAR CAMBIOS</button>
</div>
</div></div>

<div id="imagesModal"<div id="imagesModal" class="modal-bg"><div class="modal">
<div class="mh"><b>Añadir imágenes</b><button class="close" data-action="close-images-modal">×</button></div>
<div class="field"><label>Paciente</label><input id="aPatient" readonly></div>
<div class="field full"><label>ESTRUCTURA / ESTUDIO</label><div id="aStudyType" title="Haz clic para ver todas las estructuras"></div></div>
<div class="field"><label>Fecha del estudio</label><input id="aStudyDate" readonly></div>
<div class="field"><label>Imágenes <span class="optional">(puedes seleccionar varias)</span></label>
<div class="dropzone" id="aDrop" onclick="document.getElementById('aFiles').click()"><b>📎 Seleccionar imágenes</b>o arrastra una o varias imágenes aquí</div>
<input id="aFiles" type="file" accept="image/*,.dcm" multiple hidden onchange="handleFiles(this.files,'addFiles')"><div class="file-list" id="addFiles"></div></div>
<div class="modal-actions"><button class="secondary" data-action="close-images-modal">Cancelar</button><button class="btn" data-action="images-save">Añadir imágenes</button></div>
</div></div>

<div id="confirmModal" class="modal-bg"><div class="modal">
<div class="mh"><b id="confirmTitle">Confirmar</b><button class="close" data-action="close-confirm-modal">×</button></div>
<p id="confirmText" style="color:var(--muted);line-height:1.6"></p>
<div class="modal-actions"><button class="secondary" data-action="close-confirm-modal">Cancelar</button><button class="btn" id="confirmBtn">Confirmar</button></div>
</div></div>

<div id="toast" class="toast"></div>
<div id="loginModal" class="modal-bg"><div class="modal">
<div class="mh"><b>INICIAR SESIÓN</b><button class="close" data-action="close-login-modal" aria-label="Cerrar">×</button></div>
<div class="field"><label>CORREO</label><input id="loginEmail" placeholder="CORREO ELECTRÓNICO" autocomplete="username" aria-label="Correo electrónico"></div>
<div class="field" style="margin-top:10px"><label>CONTRASEÑA</label><input id="loginPass" type="password" placeholder="CONTRASEÑA" autocomplete="current-password" aria-label="Contraseña"></div>
<div style="display:flex;flex-direction:column;gap:7px;margin-top:11px">
<label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px"><input id="rememberUser" type="checkbox"> RECORDAR USUARIO</label>
<label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px"><input id="rememberPass" type="checkbox"> RECORDAR CONTRASEÑA</label>
</div>
<div class="modal-actions"><button class="secondary" data-action="close-login-modal">CANCELAR</button><button class="btn" id="loginSubmit" data-action="login-submit">INICIAR SESIÓN</button></div>
<div id="loginStatus" aria-live="polite" style="text-align:center;color:var(--muted);font-size:12px;margin-top:10px"></div>
</div></div>


<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/constants.js"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/images.js"></script>
<script src="js/patients.js"></script>
<script src="js/studies.js"></script>
<script src="js/view.js"></script>
<script src="js/app.js"></script>
<script>
window.PACS.app.start();
</script>
</body>
</html>
