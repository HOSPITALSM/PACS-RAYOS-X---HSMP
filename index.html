<script>
/* ===== config.js ===== */
window.PACS = window.PACS || {};
PACS.config = {
  supabaseUrl: "https://tapjgdzwmsfgthxncero.supabase.co",
  publishableKey: "sb_publishable_5L4-txz5pZzI6dU6UAw86w_5gXbHZr0",
  roles: {
    admin: "622de888-2abd-4f4c-b1ba-488c7472b767",
    viewer: "070c65c4-b499-4a45-ba7f-f2d5525a1d48"
  },
  storageBuckets: ["IMAGENES","imagenes","imágenes"]
};


/* ===== state.js ===== */
window.PACS = window.PACS || {};
PACS.state = {
  client: null,
  logged: false,
  role: "",
  selectedPatient: null,
  selectedStudyIndex: 0,
  selectedImage: 0,
  selectedDate: "14 AGO 2026",
  searchTerm: "",
  patients: [],
  patientFiles: [],
  addFiles: [],
  scale: 1,
  panX: 0,
  panY: 0,
  rotation: 0,
  brightness: 100,
  contrast: 100,
  invert: false,
  panMode: true,
  windowLevel: 0,
  isDraggingImage: false,
  dragStartX: 0,
  dragStartY: 0,
  panStartX: 0,
  panStartY: 0,
  pinchActive: false,
  pinchStartDistance: 0,
  pinchStartScale: 1,
  storageBucket: "IMAGENES"
};


/* ===== constants.js ===== */
window.PACS = window.PACS || {};
PACS.constants = {
  months: ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"],
  weekdays: ["L","M","M","J","V","S","D"],
  studies: [
    "TÓRAX","COLUMNA CERVICAL","COLUMNA DORSAL","COLUMNA LUMBAR","COLUMNA COMPLETA",
    "PELVIS","CADERA","ABDOMEN","CRÁNEO","SENOS PARANASALES","HOMBRO","CODO","ANTEBRAZO",
    "MUÑECA","MANO","RODILLA","PIERNA","TOBILLO","PIE","CUELLO","CLAVÍCULA","ESTERNÓN",
    "COSTILLAS","SACROCOCCÍGEA","SACROILÍACA","TEMPOROMANDIBULAR","DENTAL",
    "TC","RM","MAMOGRAFÍA","ECOGRAFÍA","OTRO"
  ]
};


/* ===== supabase.js ===== */
window.PACS = window.PACS || {};
PACS.supabase = {
  async init(){
    if(!window.supabase) throw new Error("No se cargó la librería de Supabase.");
    PACS.state.client = window.supabase.createClient(PACS.config.supabaseUrl, PACS.config.publishableKey);
    return PACS.state.client;
  },
  async storageUpload(path, file){
    const candidates = [PACS.state.storageBucket, ...PACS.config.storageBuckets.filter(x=>x!==PACS.state.storageBucket)];
    let last = null;
    for(const bucket of candidates){
      const res = await PACS.state.client.storage.from(bucket).upload(path, file, {upsert:false});
      if(!res.error){ PACS.state.storageBucket = bucket; return res; }
      last = res.error;
    }
    return {error:last || new Error("No se encontró el bucket de imágenes.")};
  },
  async signedUrl(path){
    const candidates = [PACS.state.storageBucket, ...PACS.config.storageBuckets.filter(x=>x!==PACS.state.storageBucket)];
    for(const bucket of candidates){
      const res = await PACS.state.client.storage.from(bucket).createSignedUrl(path, 3600);
      if(!res.error && res.data?.signedUrl){
        PACS.state.storageBucket = bucket;
        return res.data.signedUrl;
      }
    }
    return "";
  },
  async remove(path){
    const res = await PACS.state.client.storage.from(PACS.state.storageBucket).remove([path]);
    if(!res.error) return res;
    for(const bucket of PACS.config.storageBuckets){
      if(bucket===PACS.state.storageBucket) continue;
      const retry = await PACS.state.client.storage.from(bucket).remove([path]);
      if(!retry.error){ PACS.state.storageBucket=bucket; return retry; }
    }
    return res;
  }
};


/* ===== data.js ===== */
window.PACS = window.PACS || {};
PACS.data = {
  dateLabel(value){
    if(!value) return "";
    const raw = String(value).trim();
    const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(m){
      const mon = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
      return `${m[3]} ${mon[Number(m[2])-1]} ${m[1]}`;
    }
    const d = new Date(raw);
    if(Number.isNaN(d.getTime())) return raw.toUpperCase();
    const mon = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
    return `${String(d.getDate()).padStart(2,"0")} ${mon[d.getMonth()]} ${d.getFullYear()}`.toUpperCase();
  },
  dateISO(label){
    const [d, mon, y] = String(label).split(" ");
    const map={ENE:"01",FEB:"02",MAR:"03",ABR:"04",MAY:"05",JUN:"06",JUL:"07",AGO:"08",SEP:"09",OCT:"10",NOV:"11",DIC:"12"};
    return `${y}-${map[mon]}-${String(d).padStart(2,"0")}`;
  },
  imageItems(study){ return Array.isArray(study?.images) ? study.images : []; },
  imagePath(item){ return typeof item==="string" ? item : (item?.path || item?.storagePath || ""); },
  imageUrl(item){ return typeof item==="string" ? "" : (item?.url || item?.publicUrl || item?.localUrl || ""); },
  studyCount(study){ return this.imageItems(study).length || Number(study?.imageCount || 0) || 0; },
  mapRows(rows){
    const groups = new Map();
    (rows||[]).forEach((r, idx)=>{
      const name=String(r.patient||"").trim().toUpperCase();
      if(!name) return;
      const id=`patient-${encodeURIComponent(name)}`;
      if(!groups.has(id)) groups.set(id,{id,name,sex:r.sex||r.gender||"",studies:[]});
      groups.get(id).studies.push({
        id:r.id,
        date:this.dateLabel(r.date),
        study:String(r.structure||r.study||r.modality||"ESTUDIO").trim().toUpperCase(),
        modality:r.modality||"",
        images:Array.isArray(r.images)?r.images:[],
        createdAt:r.created_at||""
      });
    });
    for(const p of groups.values()){
      p.studies.sort((a,b)=>String(b.date).localeCompare(a.date)||String(b.createdAt).localeCompare(a.createdAt));
    }
    return [...groups.values()];
  },
  async loadStudies(){
    const {data,error}=await PACS.state.client.from("studies").select("*").order("date",{ascending:false}).order("created_at",{ascending:false});
    if(error) throw error;
    PACS.state.patients=this.mapRows(data||[]);
    return PACS.state.patients;
  },
  async hydrateImages(){
    for(const p of PACS.state.patients){
      for(const study of p.studies){
        for(const item of study.images){
          if(typeof item==="string" && PACS.data.imagePath(item)){
            const url=await PACS.supabase.signedUrl(PACS.data.imagePath(item));
            const i=study.images.indexOf(item);
            if(i>=0) study.images[i]={path:item,name:`Imagen ${i+1}`,url};
          } else if(item && typeof item==="object" && item.path && !item.url){
            const url=await PACS.supabase.signedUrl(item.path);
            if(url) item.url=url;
          }
        }
      }
    }
  },
  findPatient(id){ return PACS.state.patients.find(p=>p.id===id)||null; },
  currentStudy(){
    const p=PACS.state.selectedPatient;
    return p?.studies?.[PACS.state.selectedStudyIndex]||null;
  },
  patientsForDate(date=PACS.state.selectedDate){
    return PACS.state.patients.filter(p=>p.studies.some(s=>s.date===date));
  }
};


/* ===== ui.js ===== */
window.PACS = window.PACS || {};
PACS.ui = {
  toast(message){
    const t=document.getElementById("toast");
    if(!t) return;
    t.textContent=message;
    t.classList.add("show");
    clearTimeout(this._toastTimer);
    this._toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
  },
  openModal(id){ document.getElementById(id)?.classList.add("show"); },
  closeModal(id){ document.getElementById(id)?.classList.remove("show"); },
  closeAll(){
    document.querySelectorAll(".modal-bg.show").forEach(x=>x.classList.remove("show"));
    document.querySelectorAll(".study-options.show").forEach(x=>x.classList.remove("show"));
    document.getElementById("calendarPopup")?.classList.remove("show");
    document.getElementById("menu")?.classList.remove("show");
    document.getElementById("side")?.classList.remove("open");
    document.getElementById("overlay")?.classList.remove("show");
  },
  loading(show=false){
    const x=document.getElementById("appLoading");
    if(x) x.style.display=show?"grid":"none";
  }
};


/* ===== auth.js ===== */
window.PACS = window.PACS || {};
PACS.auth = {
  async login(email,password){
    if(!PACS.state.client) await PACS.supabase.init();
    const {data,error}=await PACS.state.client.auth.signInWithPassword({email,password});
    if(error || !data?.user) throw new Error("Correo o contraseña incorrectos.");
    const uid=data.user.id;
    if(uid===PACS.config.roles.admin) PACS.state.role="admin";
    else if(uid===PACS.config.roles.viewer) PACS.state.role="viewer";
    else {
      await PACS.state.client.auth.signOut();
      throw new Error("Este usuario no tiene acceso autorizado al PACS.");
    }
    PACS.state.logged=true;
  },
  async restore(){
    const {data,error}=await PACS.state.client.auth.getSession();
    if(error || !data?.session?.user) return false;
    const uid=data.session.user.id;
    if(uid===PACS.config.roles.admin) PACS.state.role="admin";
    else if(uid===PACS.config.roles.viewer) PACS.state.role="viewer";
    else { await PACS.state.client.auth.signOut(); return false; }
    PACS.state.logged=true;
    return true;
  },
  async logout(){
    await PACS.state.client.auth.signOut();
    Object.assign(PACS.state,{logged:false,role:"",selectedPatient:null,selectedStudyIndex:0,selectedImage:0});
  }
};


/* ===== images.js ===== */
window.PACS = window.PACS || {};
PACS.images = {
  localPreview(file){
    return {localUrl:URL.createObjectURL(file),name:file.name,path:"",url:"",pending:true};
  },
  revoke(items){
    (items||[]).forEach(x=>{ if(x?.localUrl) try{URL.revokeObjectURL(x.localUrl)}catch(_){}; });
  },
  async uploadForStudy(studyId, files){
    const uploaded=[];
    for(const file of files){
      const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const path=`studies/${studyId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safe}`;
      const up=await PACS.supabase.storageUpload(path,file);
      if(up.error) throw up.error;
      const url=await PACS.supabase.signedUrl(path);
      uploaded.push({path,name:file.name,url});
    }
    return uploaded;
  },
  async removeItem(item){
    const path=PACS.data.imagePath(item);
    if(path){
      const res=await PACS.supabase.remove(path);
      if(res.error) throw res.error;
    }
  }
};


/* ===== patients.js ===== */
window.PACS = window.PACS || {};
PACS.patients = {
  select(id){
    const p=PACS.data.findPatient(id);
    if(!p){PACS.ui.toast("No se encontró el paciente.");return;}
    PACS.state.selectedPatient=p;
    const idx=p.studies.findIndex(s=>s.date===PACS.state.selectedDate);
    PACS.state.selectedStudyIndex=idx>=0?idx:0;
    PACS.state.selectedImage=PACS.data.studyCount(PACS.data.currentStudy())>0?1:0;
    PACS.app.resetViewer();
    PACS.app.render();
    if(window.matchMedia?.("(max-width: 850px)").matches){
      this.closeSide();
      document.querySelectorAll(".mobile-nav button").forEach(b=>b.classList.remove("active"));
      document.querySelector('.mobile-nav button[data-mobile="viewer"]')?.classList.add("active");
    }
  },
  async add({name,study,date,files=[]}){
    const {data,error}=await PACS.state.client.from("studies").insert({patient:name,date:PACS.data.dateISO(date),study,structure:study,modality:(["TC","RM","MAMOGRAFÍA","ECOGRAFÍA"].includes(study)?study:"RX"),images:[]}).select("*").single();
    if(error) throw error;
    const localPreview=files.map(PACS.images.localPreview);
    const pLocal={id:`patient-${encodeURIComponent(name)}`,name,sex:"",studies:[{id:data.id,date,study,modality:data.modality,images:localPreview,createdAt:data.created_at||""}]};
    const existing=PACS.state.patients.find(p=>p.id===pLocal.id);
    if(existing) existing.studies.push(pLocal.studies[0]);
    else PACS.state.patients.push(pLocal);
    PACS.state.selectedPatient=existing||pLocal;
    PACS.state.selectedStudyIndex=(existing?existing:pLocal).studies.length-1;
    PACS.state.selectedImage=files.length?1:0;
    PACS.app.render();
    // persist files after instant UI response
    try{
      const uploaded=files.length?await PACS.images.uploadForStudy(data.id,files):[];
      if(uploaded.length){
        const {error:updateError}=await PACS.state.client.from("studies").update({images:uploaded}).eq("id",data.id);
        if(updateError) throw updateError;
        const study=PACS.data.currentStudy();
        study.images=uploaded;
        PACS.images.revoke(localPreview);
        await PACS.data.hydrateImages();
      }
      PACS.app.render();
      PACS.ui.toast(files.length?`Paciente e ${files.length} imagen(es) guardados.`:"Paciente agregado correctamente.");
    }catch(err){
      const study=PACS.data.currentStudy();
      if(study){ study.images=[]; }
      PACS.images.revoke(localPreview);
      PACS.app.render();
      PACS.ui.toast(err?.message||"Paciente creado, pero no se pudieron guardar las imágenes.");
    }
  },
  async updateName(newName){
    const p=PACS.state.selectedPatient;
    if(!p) throw new Error("Selecciona un paciente primero.");
    const oldName=p.name;
    if(oldName===newName){PACS.ui.closeModal("editModal");return;}
    // optimistic
    p.name=newName;
    PACS.app.render();
    try{
      const {error}=await PACS.state.client.from("studies").update({patient:newName}).eq("patient",oldName);
      if(error) throw error;
      PACS.ui.toast("Paciente modificado correctamente.");
    }catch(err){
      p.name=oldName;
      PACS.app.render();
      throw err;
    }
  },
  async remove(){
    const p=PACS.state.selectedPatient;
    if(!p) throw new Error("Selecciona un paciente primero.");
    const backup=[...PACS.state.patients];
    PACS.state.patients=PACS.state.patients.filter(x=>x.id!==p.id);
    PACS.state.selectedPatient=null;
    PACS.state.selectedStudyIndex=0; PACS.state.selectedImage=0;
    PACS.app.render();
    try{
      const {error}=await PACS.state.client.from("studies").delete().eq("patient",p.name);
      if(error) throw error;
      PACS.ui.toast("Paciente eliminado correctamente.");
    }catch(err){
      PACS.state.patients=backup;
      PACS.state.selectedPatient=p;
      PACS.app.render();
      throw err;
    }
  }
};


/* ===== studies.js ===== */
window.PACS = window.PACS || {};
PACS.studies = {
  select(index){
    const p=PACS.state.selectedPatient;
    if(!p?.studies?.[index]) return;
    PACS.state.selectedStudyIndex=index;
    PACS.state.selectedImage=PACS.data.studyCount(p.studies[index])>0?1:0;
    PACS.app.resetViewer();
    PACS.app.render();
  },
  async chooseDate(label){
    if(!label)return;
    PACS.state.selectedDate=label;
    document.getElementById("calendarPopup")?.classList.remove("show");

    const available=PACS.data.patientsForDate(label);
    const currentId=PACS.state.selectedPatient?.id;
    PACS.state.selectedPatient=available.find(x=>x.id===currentId)||available[0]||null;
    const idx=PACS.state.selectedPatient?.studies?.findIndex(s=>s.date===label) ?? -1;
    PACS.state.selectedStudyIndex=idx>=0?idx:0;
    PACS.state.selectedImage=PACS.data.studyCount(PACS.data.currentStudy())>0?1:0;
    PACS.app.resetViewer();
    PACS.app.render();

    try{
      await PACS.data.loadStudies();
      const refreshed=PACS.data.patientsForDate(label);
      const keepId=PACS.state.selectedPatient?.id;
      PACS.state.selectedPatient=refreshed.find(x=>x.id===keepId)||refreshed[0]||null;
      const idx2=PACS.state.selectedPatient?.studies?.findIndex(s=>s.date===label) ?? -1;
      PACS.state.selectedStudyIndex=idx2>=0?idx2:0;
      PACS.state.selectedImage=PACS.data.studyCount(PACS.data.currentStudy())>0?1:0;
      PACS.app.resetViewer();
      PACS.app.render();
      PACS.data.hydrateImages().then(()=>PACS.app.render()).catch(err=>console.error("Image hydration:",err));
    }catch(err){
      console.error("Calendar refresh:",err);
      PACS.ui.toast("Se cambió la fecha, pero no se pudo actualizar el contenido remoto.");
    }
  }
};


/* ===== view.js ===== */
window.PACS = window.PACS || {};
PACS.view = {
  patientIcon(sex){ return sex==="M"?"👨":sex==="F"?"👩":"👤"; },
  patientList(){
    const list=PACS.data.patientsForDate();
    if(!list.length) return `<div class="patient-empty">No hay pacientes registrados en esta fecha.</div>`;
    return list.map(p=>{
      const active=PACS.state.selectedPatient?.id===p.id;
      const s=p.studies.find(x=>x.date===PACS.state.selectedDate)||p.studies[0];
      return `<button type="button" class="patient ${active?"active":""}" data-patient="${encodeURIComponent(p.id)}"><strong>${this.patientIcon(p.sex)} ${p.name}</strong><span>${s?.study||"Ver historial"} · ${PACS.data.studyCount(s)} imágenes</span></button>`;
    }).join("");
  },
  history(){
    const p=PACS.state.selectedPatient;
    if(!p?.studies?.length) return `<div class="muted">No hay estudios registrados para este paciente.</div>`;
    let last="",out="";
    p.studies.forEach((s,i)=>{
      if(s.date!==last){ out+=`<div class="day">${s.date}</div>`; last=s.date; }
      out+=`<button type="button" class="study ${i===PACS.state.selectedStudyIndex?"active-study":""}" data-study-index="${i}">
        <div><b>🩻 ${s.study}</b><br><span>${s.createdAt?new Date(s.createdAt).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}):""} · <span class="ok">Disponible</span></span></div>
        <span>${PACS.data.studyCount(s)} imágenes ›</span>
      </button>`;
    });
    return out;
  },
  renderThumbs(study){
    const items=PACS.data.imageItems(study);
    if(!items.length) return "";
    return items.map((item,i)=>{
      const url=PACS.data.imageUrl(item);
      const label=item?.name||`Imagen ${i+1}`;
      return `<button type="button" class="thumb ${PACS.state.selectedImage===i+1?"active":""}" data-image-index="${i+1}">
        ${url?`<img src="${url}" alt="${label}" loading="lazy">`:`<span class="thumb-loading">⌛</span>`}<span>${i+1}</span>
      </button>`;
    }).join("");
  }
};



/* ===== file helpers ===== */
window.handleFiles=function(files,target){
  const arr=Array.from(files||[]);
  const state=window.PACS?.state;
  if(!state)return;
  if(target==="patientFiles")state.patientFiles.push(...arr);
  if(target==="addFiles")state.addFiles.push(...arr);
  const list=target==="patientFiles"?state.patientFiles:state.addFiles;
  const el=document.getElementById(target);
  if(el){
    el.innerHTML=list.map(f=>`<div class="file-row"><span>🖼️ ${String(f.name).replace(/</g,"&lt;")}</span><span>${Math.max(1,Math.round((f.size||0)/1024))} KB</span></div>`).join("");
  }
};

    this.renderThumbSync();

  renderThumbSync(){
    // No-op: thumbs are already part of the render() HTML.
  },


  rotateLeft(){
    PACS.state.rotation=(PACS.state.rotation+270)%360;
    this.applyViewerTransform();
  },
  rotateRight(){
    PACS.state.rotation=(PACS.state.rotation+90)%360;
    this.applyViewerTransform();
  },
  toggleInvert(){
    PACS.state.invert=!PACS.state.invert;
    this.applyViewerTransform();
  },
  adjustContrast(delta){
    PACS.state.contrast=Math.max(40,Math.min(200,PACS.state.contrast+delta));
    this.applyViewerTransform();
  },
  adjustWindow(delta){
    // Controls "penetración" / window level without changing the viewer frame.
    PACS.state.windowLevel=Math.max(-100,Math.min(100,PACS.state.windowLevel+delta));
    PACS.state.brightness=Math.max(60,Math.min(160,100+PACS.state.windowLevel*0.4));
    this.applyViewerTransform();
  },
  resetViewer(){
    Object.assign(PACS.state,{
      scale:1,panX:0,panY:0,rotation:0,
      brightness:100,contrast:100,invert:false,windowLevel:0,
      panMode:true,isDraggingImage:false
    });
    this.applyViewerTransform();
  },
  clampPan(){
    const frame=document.getElementById("image");
    if(!frame)return;
    const maxX=frame.clientWidth*1.5;
    const maxY=frame.clientHeight*1.5;
    PACS.state.panX=Math.max(-maxX,Math.min(maxX,PACS.state.panX));
    PACS.state.panY=Math.max(-maxY,Math.min(maxY,PACS.state.panY));
  },
  applyViewerTransform(){
    const img=document.querySelector("#image .xray img");
    if(!img)return;
    this.clampPan();
    const s=PACS.state;
    img.style.transform=`translate(${s.panX}px, ${s.panY}px) scale(${s.scale}) rotate(${s.rotation}deg)`;
    const invert=s.invert?1:0;
    img.style.filter=` brightness(${s.brightness/100}) contrast(${s.contrast/100}) invert(${invert})`;
    img.style.cursor=s.panMode?"grab":"default";
    document.querySelectorAll(".tool[data-tool]").forEach(b=>{
      const active =
        (b.dataset.tool==="pan" && s.panMode) ||
        (b.dataset.tool==="invert" && s.invert);
      b.classList.toggle("active",active);
    });
  },
  viewerZoom(factor,centerX=null,centerY=null){
    const s=PACS.state, old=s.scale;
    const next=Math.max(0.25,Math.min(6,old*factor));
    if(Math.abs(next-old)<0.001)return;
    if(centerX!=null&&centerY!=null){
      const frame=document.getElementById("image");
      const rect=frame?.getBoundingClientRect();
      if(rect){
        const cx=centerX-(rect.left+rect.width/2);
        const cy=centerY-(rect.top+rect.height/2);
        const ratio=(next/old)-1;
        s.panX-=cx*ratio;
        s.panY-=cy*ratio;
      }
    }
    s.scale=next;
    this.applyViewerTransform();
  },
  startImageDrag(e){
    const img=e.target.closest?.("#image .xray img");
    if(!img||!PACS.state.panMode||PACS.state.pinchActive)return;
    e.preventDefault();
    PACS.state.isDraggingImage=true;
    PACS.state.dragStartX=e.clientX; PACS.state.dragStartY=e.clientY;
    PACS.state.panStartX=PACS.state.panX; PACS.state.panStartY=PACS.state.panY;
    try{img.setPointerCapture?.(e.pointerId);}catch(_){}
  },
  moveImageDrag(e){
    if(!PACS.state.isDraggingImage)return;
    const s=PACS.state;
    s.panX=s.panStartX+(e.clientX-s.dragStartX);
    s.panY=s.panStartY+(e.clientY-s.dragStartY);
    this.applyViewerTransform();
  },
  endImageDrag(){PACS.state.isDraggingImage=false;},

  touchDistance(touches){
    const a=touches[0],b=touches[1];
    return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  },
  startPinch(e){
    if(e.touches?.length!==2)return;
    e.preventDefault();
    PACS.state.pinchActive=true;
    PACS.state.isDraggingImage=false;
    PACS.state.pinchStartDistance=this.touchDistance(e.touches);
    PACS.state.pinchStartScale=PACS.state.scale;
  },
  movePinch(e){
    if(!PACS.state.pinchActive || e.touches?.length<2)return;
    e.preventDefault();
    const dist=this.touchDistance(e.touches);
    const base=PACS.state.pinchStartDistance||dist;
    const factor=dist/base;
    const centerX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const centerY=(e.touches[0].clientY+e.touches[1].clientY)/2;
    this.viewerZoom(PACS.state.pinchStartScale?factor:1,centerX,centerY);
  },
  endPinch(e){
    if(e.touches?.length<2)PACS.state.pinchActive=false;
  },
  bindGlobalEvents(){
    if(this._eventsBound)return;
    this._eventsBound=true;
    document.addEventListener("click", e=>this.onClick(e));
    document.addEventListener("keydown", e=>this.onKey(e));
    document.addEventListener("input", e=>{
      if(e.target?.id==="topSearch" || e.target?.id==="mobileSearch"){
        PACS.state.searchTerm=e.target.value.trim().toLowerCase();
        this.renderSearchResults(e.target.id==="mobileSearch");
      }
    });
    document.addEventListener("wheel",e=>{
      const image=e.target.closest?.("#image");
      if(!image)return;
      e.preventDefault();
      this.viewerZoom(e.deltaY<0?1.12:0.89,e.clientX,e.clientY);
    },{passive:false});

    document.addEventListener("pointerdown",e=>this.startImageDrag(e));
    document.addEventListener("pointermove",e=>this.moveImageDrag(e));
    document.addEventListener("pointerup",()=>this.endImageDrag());
    document.addEventListener("pointercancel",()=>this.endImageDrag());

    // Mobile pinch-to-zoom. One-finger pointer drag remains unchanged.
    document.addEventListener("touchstart",e=>this.startPinch(e),{passive:false});
    document.addEventListener("touchmove",e=>this.movePinch(e),{passive:false});
    document.addEventListener("touchend",e=>this.endPinch(e),{passive:false});
    document.addEventListener("touchcancel",e=>this.endPinch(e),{passive:false});

  },
  async onClick(e){
    const action=e.target.closest?.("[data-action]")?.dataset?.action;
    const patientBtn=e.target.closest?.("[data-patient]")?.dataset?.patient;
    const studyBtn=e.target.closest?.("[data-study-index]");
    const imageBtn=e.target.closest?.("[data-image-index]");
    const tool=e.target.closest?.("[data-tool]")?.dataset?.tool;
    const mobile=e.target.closest?.("[data-mobile]")?.dataset?.mobile;

    if(patientBtn){ e.preventDefault(); return PACS.patients.select(decodeURIComponent(patientBtn)); }
    if(studyBtn){ e.preventDefault(); return PACS.studies.select(Number(studyBtn.dataset.studyIndex)); }
    if(imageBtn){ e.preventDefault(); PACS.state.selectedImage=Number(imageBtn.dataset.imageIndex); return this.render(); }
    if(tool){
      e.preventDefault();
      if(tool==="zoom-out")this.viewerZoom(0.85);
      else if(tool==="zoom-in")this.viewerZoom(1.18);
      else if(tool==="pan"){PACS.state.panMode=!PACS.state.panMode;this.applyViewerTransform();}
      else if(tool==="rotate-left")this.rotateLeft();
      else if(tool==="rotate-right")this.rotateRight();
      else if(tool==="invert")this.toggleInvert();
      else if(tool==="contrast-down")this.adjustContrast(-10);
      else if(tool==="contrast-up")this.adjustContrast(10);
      else if(tool==="window-down")this.adjustWindow(-10);
      else if(tool==="window-up")this.adjustWindow(10);
      else if(tool==="reset")this.resetViewer();
      return;
    }

    const picker=e.target.closest?.("[data-study-picker]")?.dataset?.studyPicker;
    if(picker){
      e.preventDefault();
      const opts=document.getElementById(picker+"Options");
      if(opts){
        opts.innerHTML=PACS.constants.studies.map(s=>`<button type="button" class="study-option" data-study-choice="${picker}" data-value="${s.replace(/"/g,"&quot;")}">${s}</button>`).join("");
        opts.classList.add("show");
      }
      return;
    }

    const choice=e.target.closest?.("[data-study-choice]");
    if(choice){
      e.preventDefault();
      return this.renderStudyChoice(choice.dataset.studyChoice,choice.dataset.value);
    }

const calDate=e.target.closest?.("[data-calendar-date]")?.dataset?.calendarDate;
    if(calDate){ return PACS.studies.chooseDate(calDate); }
    const step=e.target.closest?.("[data-calendar-step]")?.dataset?.calendarStep;
    if(step){ e.preventDefault(); return this.moveCalendar(Number(step)); }

    if(!action) return;

    e.preventDefault();
    if(action==="login-open")return this.openLogin();
    if(action==="menu-toggle")return document.getElementById("menu")?.classList.toggle("show");
    if(action==="logout"){await PACS.auth.logout();return this.home();}
    if(action==="fullscreen"){document.getElementById("image")?.requestFullscreen?.();return;}
    if(action==="add-patient")return this.openAddPatient();
    if(action==="edit-patient")return this.openEditPatient();
    if(action==="add-images")return this.openAddImages();
    if(action==="delete-image")return this.openDeleteImage();
    if(action==="delete-patient")return this.openDeletePatient();
    if(action==="calendar-toggle")return this.toggleCalendar(e);
    if(action==="side-close")return this.closeSide();
    if(action==="close-patient-modal"){return PACS.ui.closeModal("patientModal");}
    if(action==="close-edit-modal"){return PACS.ui.closeModal("editModal");}
    if(action==="close-images-modal"){return PACS.ui.closeModal("imagesModal");}
    if(action==="close-confirm-modal"){return PACS.ui.closeModal("confirmModal");}
    if(action==="close-login-modal"){return PACS.ui.closeModal("loginModal");}
    if(action==="login-submit")return this.doLogin();
    if(action==="add-patient-save")return this.savePatient();
    if(action==="edit-save")return this.saveEdit();
    if(action==="images-save")return this.saveImages();
  },
  async doLogin(){
    const email=(document.getElementById("loginEmail")?.value||"").trim();
    const pass=(document.getElementById("loginPass")?.value||"").trim();
    const status=document.getElementById("loginStatus");
    if(!email){if(status)status.textContent="Escribe tu correo.";return;}
    if(!pass){if(status)status.textContent="Escribe tu contraseña.";return;}
    const btn=document.getElementById("loginSubmit"); if(btn)btn.disabled=true;
    try{await PACS.auth.login(email,pass);PACS.ui.closeModal("loginModal");await this.sync();this.render();}
    catch(err){if(status)status.textContent=err.message||"No se pudo iniciar sesión.";}
    finally{if(btn)btn.disabled=false;}
  },
  openLogin(){
    PACS.ui.openModal("loginModal");
    document.getElementById("loginStatus").textContent="";
    document.getElementById("loginEmail")?.focus();
  },
  openAddPatient(){
    if(PACS.state.role!=="admin"){return PACS.ui.toast("Solo el Administrador puede agregar pacientes.");}
    document.getElementById("pName").value="";
    document.getElementById("pDni").value="";
    document.getElementById("pSex").value="";
    document.getElementById("pBirth").value="";
    document.getElementById("pStudyDate").textContent=PACS.state.selectedDate;
    PACS.state.patientFiles=[];
    document.getElementById("patientFiles").innerHTML="";
    this.openStudyPicker("pStudyType");
    PACS.ui.openModal("patientModal");
  },
  openEditPatient(){
    const p=PACS.state.selectedPatient;
    if(PACS.state.role!=="admin")return PACS.ui.toast("Solo el Administrador puede modificar pacientes.");
    if(!p)return PACS.ui.toast("Selecciona un paciente primero para realizar esta acción.");
    document.getElementById("eName").value=p.name;
    document.getElementById("eDni").value="";
    document.getElementById("eSex").value="";
    document.getElementById("eBirth").value="";
    PACS.ui.openModal("editModal");
  },
  openAddImages(){
    const p=PACS.state.selectedPatient;
    if(PACS.state.role!=="admin")return PACS.ui.toast("Solo el Administrador puede añadir imágenes.");
    if(!p)return PACS.ui.toast("Selecciona un paciente primero para realizar esta acción.");
    const study=PACS.data.currentStudy();
    if(!study)return PACS.ui.toast("Selecciona un estudio primero.");
    document.getElementById("aPatient").value=p.name;
    document.getElementById("aStudyDate").value=study.date;
    PACS.state.addFiles=[];
    document.getElementById("addFiles").innerHTML="";
    this.openStudyPicker("aStudyType",study.study);
    PACS.ui.openModal("imagesModal");
  },
  openDeleteImage(){
    const p=PACS.state.selectedPatient,study=PACS.data.currentStudy();
    if(PACS.state.role!=="admin")return PACS.ui.toast("Solo el Administrador puede eliminar imágenes.");
    if(!p)return PACS.ui.toast("Selecciona un paciente primero para realizar esta acción.");
    if(!study||!study.images.length)return PACS.ui.toast("El estudio seleccionado no tiene imágenes.");
    PACS.ui.openModal("confirmModal");
    document.getElementById("confirmTitle").textContent="ELIMINAR IMAGEN";
    document.getElementById("confirmText").textContent=`¿Deseas eliminar la imagen ${PACS.state.selectedImage||1} del estudio ${study.study}?`;
    document.getElementById("confirmBtn").onclick=async()=>{
      PACS.ui.closeModal("confirmModal");
      const index=Math.max(0,Math.min(study.images.length-1,(PACS.state.selectedImage||1)-1));
      const backup=study.images.slice();
      const deleted=study.images.splice(index,1)[0];
      PACS.state.selectedImage=study.images.length?Math.min(index+1,study.images.length):0;
      this.render();
      try{
        await PACS.images.removeItem(deleted);
        const {error}=await PACS.state.client.from("studies").update({images:study.images}).eq("id",study.id);
        if(error)throw error;
        PACS.images.revoke([deleted]);
        PACS.ui.toast("Imagen eliminada correctamente.");
      }catch(err){
        study.images=backup; PACS.state.selectedImage=index+1; this.render();
        PACS.ui.toast(err.message||"No se pudo eliminar la imagen.");
      }
    };
  },
  openDeletePatient(){
    const p=PACS.state.selectedPatient;
    if(PACS.state.role!=="admin")return PACS.ui.toast("Solo el Administrador puede eliminar pacientes.");
    if(!p)return PACS.ui.toast("Selecciona un paciente primero para realizar esta acción.");
    PACS.ui.openModal("confirmModal");
    document.getElementById("confirmTitle").textContent="ELIMINAR PACIENTE";
    document.getElementById("confirmText").textContent=`¿Deseas eliminar al paciente ${p.name}?`;
    document.getElementById("confirmBtn").onclick=async()=>{
      PACS.ui.closeModal("confirmModal");
      const backup=PACS.state.patients.slice();
      PACS.state.patients=PACS.state.patients.filter(x=>x.id!==p.id);
      PACS.state.selectedPatient=null;
      this.render();
      try{
        const {error}=await PACS.state.client.from("studies").delete().eq("patient",p.name);
        if(error)throw error;
        PACS.ui.toast("Paciente eliminado correctamente.");
      }catch(err){
        PACS.state.patients=backup; PACS.state.selectedPatient=p; this.render();
        PACS.ui.toast(err.message||"No se pudo eliminar el paciente.");
      }
    };
  },
  openStudyPicker(id,selected=""){
    const wrap=document.getElementById(id);
    if(!wrap)return;
    const value=selected||"";
    wrap.innerHTML=`<div class="study-search-wrap"><button type="button" class="study-picker-btn" data-study-picker="${id}"><span id="${id}Label">${value||"SELECCIONA ESTRUCTURA / ESTUDIO"}</span><span class="study-picker-arrow">▾</span></button><div class="study-options" id="${id}Options"></div></div><div class="study-selected" id="${id}Selected">${value?"ESTRUCTURA SELECCIONADA: "+value:"SELECCIONAR ESTRUCTURA / ESTUDIO"}</div>`;
  },
  async savePatient(){
    const name=document.getElementById("pName").value.trim().toUpperCase();
    const study=(document.getElementById("pStudyTypeLabel")?.textContent||"").trim().toUpperCase();
    if(!name)return PACS.ui.toast("El nombre del paciente es obligatorio.");
    if(!PACS.constants.studies.includes(study))return PACS.ui.toast("Selecciona una estructura / estudio.");
    const files=PACS.state.patientFiles.slice();
    await PACS.patients.add({name,study,date:PACS.state.selectedDate,files});
    PACS.ui.closeModal("patientModal");
  },
  async saveEdit(){
    try{await PACS.patients.updateName(document.getElementById("eName").value.trim().toUpperCase());PACS.ui.closeModal("editModal");}
    catch(err){PACS.ui.toast(err.message||"No se pudo modificar el paciente.");}
  },
  async saveImages(){
    const study=PACS.data.currentStudy();
    const files=PACS.state.addFiles.slice();
    if(!study)return PACS.ui.toast("Selecciona un estudio primero.");
    if(!files.length)return PACS.ui.toast("Selecciona al menos una imagen.");
    const previews=files.map(PACS.images.localPreview);
    const backup=study.images.slice();
    study.images.push(...previews);
    PACS.state.selectedImage=backup.length?1:1;
    PACS.ui.closeModal("imagesModal"); this.render(); PACS.ui.toast("Mostrando imágenes mientras se guardan…");
    try{
      const uploaded=await PACS.images.uploadForStudy(study.id,files);
      const {error}=await PACS.state.client.from("studies").update({images:[...backup,...uploaded]}).eq("id",study.id);
      if(error)throw error;
      PACS.images.revoke(previews);
      study.images=[...backup,...uploaded];
      await PACS.data.hydrateImages();
      this.render();
      PACS.ui.toast("Imágenes guardadas correctamente.");
    }catch(err){
      study.images=backup; PACS.images.revoke(previews); this.render();
      PACS.ui.toast(err.message||"No se pudieron guardar las imágenes.");
    }
  },
  renderStudyChoice(id,value){
    const label=document.getElementById(id+"Label");
    if(label)label.textContent=value;
    const s=document.getElementById(id+"Selected");
    if(s)s.textContent="ESTRUCTURA SELECCIONADA: "+value;
    document.getElementById(id+"Options")?.classList.remove("show");
  },
  toggleCalendar(e){
    e?.stopPropagation();
    const popup=document.getElementById("calendarPopup");
    if(!popup)return;
    popup.classList.toggle("show");
    if(popup.classList.contains("show"))this.drawCalendar();
  },
  drawCalendar(){
    const popup=document.getElementById("calendarPopup"); if(!popup)return;
    const [d,mon,y]=PACS.state.selectedDate.split(" ");
    let month=PACS.constants.months.findIndex(m=>m.startsWith(mon)); if(month<0)month=7;
    const year=Number(y)||new Date().getFullYear();
    const first=new Date(year,month,1), start=(first.getDay()+6)%7;
    const days=new Date(year,month+1,0).getDate();
    let html="";
    PACS.constants.weekdays.forEach(w=>html+=`<div class="cal-week">${w}</div>`);
    for(let i=0;i<42;i++){
      const day=i-start+1; if(day<1||day>days){html+=`<div class="cal-day muted-day"></div>`;continue;}
      const label=`${String(day).padStart(2,"0")} ${PACS.constants.months[month].slice(0,3)} ${year}`;
      const selected=label===PACS.state.selectedDate;
      const has=PACS.data.patientsForDate(label).length>0;
      html+=`<button type="button" class="cal-day ${selected?"selected":""} ${has?"has-study":""}" data-calendar-date="${label}">${day}</button>`;
    }
    popup.innerHTML=`<div class="cal-head"><button class="cal-nav" data-calendar-step="-1">‹</button><div class="cal-title">${PACS.constants.months[month]} ${year}</div><button class="cal-nav" data-calendar-step="1">›</button></div><div class="cal-grid">${html}</div>`;
  },
  moveCalendar(delta){
    const popup=document.getElementById("calendarPopup");
    if(!popup)return;
    const [d,mon,y]=PACS.state.selectedDate.split(" ");
    let month=PACS.constants.months.findIndex(m=>m.startsWith(mon)); if(month<0)month=7;
    let year=Number(y)||new Date().getFullYear();
    month+=delta;
    if(month<0){month=11;year--;} if(month>11){month=0;year++;}
    const old=PACS.state.selectedDate;
    const temp=`01 ${PACS.constants.months[month].slice(0,3)} ${year}`;
    PACS.state.selectedDate=temp;
    this.drawCalendar();
    PACS.state.selectedDate=old;
  },
  mobileNavigate(which){
    document.querySelectorAll(".mobile-nav button").forEach(b=>b.classList.remove("active"));
    document.querySelector(`.mobile-nav button[data-mobile="${which}"]`)?.classList.add("active");

    if(which==="patients"){
      document.getElementById("side")?.classList.add("open");
      document.getElementById("overlay")?.classList.add("show");
      return;
    }

    this.closeSide();
    if(which==="viewer"){
      document.getElementById("image")?.scrollIntoView({behavior:"smooth",block:"start"});
      return;
    }

    window.scrollTo({top:0,behavior:"smooth"});
  },
  closeSide(){document.getElementById("side")?.classList.remove("open");document.getElementById("overlay")?.classList.remove("show");},
  async onKey(e){
    if(e.key==="Escape"){PACS.ui.closeAll();return;}
    if(e.key==="Enter" && document.getElementById("loginModal")?.classList.contains("show")){
      if(e.target?.tagName?.toLowerCase()==="input"){e.preventDefault();await this.doLogin();}
    }
  }
};


</script>
<script>
window.PACS.app.start();
</script>
</body>
