<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
document.addEventListener("keydown",e=>{
  const active=document.activeElement;
  const isPicker=active?.classList?.contains("study-picker-btn");
  if(!isPicker)return;
  if(e.key==="Enter" || e.key===" "){
    e.preventDefault();
    const id=(active.id||"").replace("Picker","");
    const opts=document.getElementById(id+"Options");
    renderStudyOptions(id,"");
    opts?.classList.toggle("show");
  }
  if(e.key==="Escape"){
    const id=(active.id||"").replace("Picker","");
    document.getElementById(id+"Options")?.classList.remove("show");
  }
});

</script>

<script>

const SUPABASE_CONFIG = {
  url: 'https://tapjgdzwmsfgthxncero.supabase.co',
  anonKey: 'sb_publishable_5L4-txz5pZzI6dU6UAw86w_5gXbHZr0'
};

const ROLE_UIDS = {
  admin: "622de888-2abd-4f4c-b1ba-488c7472b767",
  viewer: "070c65c4-b499-4a45-ba7f-f2d5525a1d48"
};

let supabaseClient = null;
let P = [];
let sel = null, si = 0, img = 1, scale = 1, logged = false;
let selectedDate = "14 AGO 2026", searchTerm = "", currentRole = "";

function initSupabase(){
  if (!window.supabase || !SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) return false;
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

function roleFromUser(user){
  const uid = user?.id || "";
  if (uid === ROLE_UIDS.admin) return "admin";
  if (uid === ROLE_UIDS.viewer) return "viewer";
  return "";
}

function setViewerClass(){
  document.body.classList.toggle("viewer-only", currentRole === "viewer");
}

function loadRememberedUser(){
  try {
    const saved = localStorage.getItem("pacsRememberedUser");
    const el = document.getElementById("loginEmail");
    if (saved && el) el.value = saved;
  } catch (_) {}
}

function home(){
  root.innerHTML = `<div class="screen"><div class="center"><div class="logo">🏥</div>
  <h1>HOSPITAL SAN MARTIN DE PANGOA</h1><p>DIAGNÓSTICO POR IMAGEN</p>
  <button class="btn" onclick="openLogin()">Iniciar sesión</button></div></div>`;
}

function openLogin(){
  const status = document.getElementById("loginStatus");
  if (status) status.textContent = "";
  loadRememberedUser();
  document.getElementById("loginPass").value = "";
  document.getElementById("loginModal")?.classList.add("show");
}

function openModal(id){ document.getElementById(id)?.classList.add("show"); }
function closeModal(id){ document.getElementById(id)?.classList.remove("show"); }

async function doLogin(){
  const email = (document.getElementById("loginEmail")?.value || "").trim();
  const pass = (document.getElementById("loginPass")?.value || "").trim();
  const status = document.getElementById("loginStatus");
  if (status) status.textContent = "";

  if (!email) { if (status) status.textContent = "Escribe tu correo."; return; }
  if (!pass) { if (status) status.textContent = "Escribe tu contraseña."; return; }
  if (!supabaseClient) {
    if (status) status.textContent = "No se pudo inicializar la conexión con Supabase.";
    return;
  }

  const btn = document.getElementById("loginSubmit");
  if (btn) { btn.disabled = true; btn.textContent = "VERIFICANDO…"; }

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: pass
    });

    if (error || !data?.user) {
      if (status) status.textContent = "Correo o contraseña incorrectos.";
      return;
    }

    const role = roleFromUser(data.user);
    if (!role) {
      await supabaseClient.auth.signOut();
      if (status) status.textContent = "Este usuario no tiene acceso autorizado al PACS.";
      return;
    }

    currentRole = role;
    logged = true;
    setViewerClass();
    await loadStudiesFromSupabase();

    try {
      if (document.getElementById("rememberUser")?.checked) {
        localStorage.setItem("pacsRememberedUser", email);
      }
    } catch (_) {}

    closeModal("loginModal");
    render();
  } catch (e) {
    console.error(e);
    if (status) status.textContent = "No se pudo conectar con Supabase.";
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "INICIAR SESIÓN"; }
  }
}


function parseStudyImagesCount(value){
  if (Array.isArray(value)) return value.length;
  if (typeof value === "number" && Number.isFinite(value)) return value;
  if (typeof value === "string"){
    const v=value.trim();
    if(!v) return 0;
    if(/^\d+$/.test(v)) return Number(v);
    try{
      const parsed=JSON.parse(v);
      if(Array.isArray(parsed)) return parsed.length;
      if(parsed && typeof parsed==="object"){
        if(Array.isArray(parsed.images)) return parsed.images.length;
        if(Number.isFinite(Number(parsed.count))) return Number(parsed.count);
      }
    }catch(_){}
  }
  if(value && typeof value==="object"){
    if(Array.isArray(value.images)) return value.images.length;
    if(Number.isFinite(Number(value.count))) return Number(value.count);
  }
  return 0;
}

function normalizeStudyDate(v){
  if(!v) return "";
  const raw=String(v).trim();
  const isoDateOnly=/^(\d{4})-(\d{2})-(\d{2})$/;
  const m=raw.match(isoDateOnly);
  if(m){
    const months=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
    return `${m[3]} ${months[Number(m[2])-1]} ${m[1]}`.toUpperCase();
  }
  const d=new Date(raw);
  if(Number.isNaN(d.getTime())) return raw.toUpperCase();
  const months=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  return `${String(d.getDate()).padStart(2,"0")} ${months[d.getMonth()]} ${d.getFullYear()}`.toUpperCase();
}

function mapStudiesRows(rows){
  const groups=new Map();
  (rows||[]).forEach((r,idx)=>{
    const patient=String(r.patient||"").trim().toUpperCase();
    if(!patient)return;
    const date=normalizeStudyDate(r.date);
    const structure=String(r.structure||r.study||"").trim().toUpperCase();
    const studyName=String(r.study||structure||r.modality||"ESTUDIO").trim().toUpperCase();
    const imagesCount=parseStudyImagesCount(r.images);
    const key=patient;
    if(!groups.has(key)){
      groups.set(key,{id:`patient-${encodeURIComponent(patient)}`,n:patient,g:r.sex||r.gender||"U",s:[],dbIds:[]});
    }
    const p=groups.get(key);
    p.dbIds.push(r.id);
    p.s.push([date,structure||studyName,imagesCount,r.created_at?new Date(r.created_at).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}):"",r.id]);
  });
  return Array.from(groups.values()).map(p=>{
    p.s.sort((a,b)=>String(b[0]).localeCompare(String(a[0]))||String(b[3]).localeCompare(String(a[3])));
    return p;
  });
}


const STORAGE_BUCKET_CANDIDATES = ["IMAGENES","imagenes","imágenes"];
let ACTIVE_STORAGE_BUCKET = "IMAGENES";
async function storageUpload(path,file){
  let lastError=null;
  for(const bucket of [ACTIVE_STORAGE_BUCKET,...STORAGE_BUCKET_CANDIDATES.filter(b=>b!==ACTIVE_STORAGE_BUCKET)]){
    const res=await supabaseClient.storage.from(bucket).upload(path,file,{upsert:false});
    if(!res.error){ACTIVE_STORAGE_BUCKET=bucket;return res;}
    lastError=res.error;
  }
  return {error:lastError||new Error("No se encontró el bucket de imágenes.")};
}
async function storageSignedUrl(path){
  for(const bucket of [ACTIVE_STORAGE_BUCKET,...STORAGE_BUCKET_CANDIDATES.filter(b=>b!==ACTIVE_STORAGE_BUCKET)]){
    const res=await supabaseClient.storage.from(bucket).createSignedUrl(path,3600);
    if(!res.error && res.data?.signedUrl){ACTIVE_STORAGE_BUCKET=bucket;return res.data.signedUrl;}
  }
  return "";
}
async function storageRemove(path){
  const res=await supabaseClient.storage.from(ACTIVE_STORAGE_BUCKET).remove([path]);
  if(!res.error)return res;
  for(const bucket of STORAGE_BUCKET_CANDIDATES){
    if(bucket===ACTIVE_STORAGE_BUCKET)continue;
    const retry=await supabaseClient.storage.from(bucket).remove([path]);
    if(!retry.error){ACTIVE_STORAGE_BUCKET=bucket;return retry;}
  }
  return res;
}


function studyRowToLocal(row){
  const date=normalizeStudyDate(row.date);
  const structure=String(row.structure||row.study||row.modality||"ESTUDIO").trim().toUpperCase();
  const count=parseStudyImagesCount(row.images);
  return [date,structure,count,row.created_at?new Date(row.created_at).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}):"",row.id,row.images||[]];
}

function upsertLocalStudy(row){
  const patient=String(row.patient||"").trim().toUpperCase();
  if(!patient)return;
  const id=`patient-${encodeURIComponent(patient)}`;
  let p=P.find(x=>x.id===id);
  if(!p){
    p={id,n:patient,g:row.sex||row.gender||"U",s:[]};
    P.push(p);
  }
  const local=studyRowToLocal(row);
  const idx=p.s.findIndex(s=>String(s[4])===String(row.id));
  if(idx>=0)p.s[idx]=local;else p.s.push(local);
  p.s.sort((a,b)=>String(b[0]).localeCompare(String(a[0]))||String(b[3]).localeCompare(String(a[3])));
  return p;
}

function removeLocalPatient(patientName){
  const name=String(patientName||"").trim().toUpperCase();
  P=P.filter(p=>p.n!==name);
  if(sel?.n===name)sel=null;
}

function getStudyImageObjects(study){
  const raw=study?.[5];
  if(Array.isArray(raw)) return raw;
  if(raw && typeof raw==="object" && Array.isArray(raw.images)) return raw.images;
  return [];
}

function storageObjectPath(studyImage){
  if(typeof studyImage==="string") return studyImage;
  return studyImage?.path || studyImage?.storagePath || "";
}


async function hydrateImageUrls(){
  if(!supabaseClient)return;
  for(const patient of P){
    for(const study of patient.s||[]){
      const items=getStudyImageObjects(study);
      if(!items.length)continue;
      for(let i=0;i<items.length;i++){
        const item=items[i];
        const path=storageObjectPath(item);
        if(!path)continue;
        if(typeof item==="object" && item.url)continue;
        try{
          const url=await storageSignedUrl(path);
          if(!url)continue;
          if(typeof item==="string"){
            items[i]={path,name:`Imagen ${i+1}`,url};
          }else{
            item.url=url;
          }
        }catch(err){console.error("Storage signed URL:",err);}
      }
    }
  }
}

function currentImageUrl(){
  const study=sel?.s?.[si];
  const items=getStudyImageObjects(study);
  const item=items[Math.max(0,img-1)];
  return getImageUrl(item);
}


function makeLocalImageItem(file,index){
  return {
    localUrl:URL.createObjectURL(file),
    name:file.name,
    path:"",
    url:"",
    pending:true,
    index
  };
}
function revokeLocalImages(items){
  (items||[]).forEach(it=>{
    if(it?.localUrl){
      try{URL.revokeObjectURL(it.localUrl);}catch(_){}
    }
  });
}
function getImageUrl(item){
  return item?.url || item?.publicUrl || item?.localUrl || "";
}

function renderCurrentThumbs(){
  const strip=document.querySelector(".thumbs");
  if(!strip)return;
  const study=sel?.s?.[si];
  const items=getStudyImageObjects(study);
  if(!items.length){strip.innerHTML="";return;}
  strip.innerHTML=items.map((it,i)=>{
    const url=getImageUrl(it);
    const label=it?.name||`Imagen ${i+1}`;
    return `<button class="thumb ${img===i+1?"active":""}" type="button"
      title="${String(label).replace(/"/g,"&quot;")}" onclick="selectStudyImage(${i+1})">
      ${url?`<img src="${url}" alt="${String(label).replace(/"/g,"&quot;")}" loading="lazy">`:`<span class="thumb-loading">⌛</span>`}
      <span>${i+1}</span>
    </button>`;
  }).join("");
}

function selectStudyImage(n){
  img=Math.max(1,Number(n)||1);
  render();
}

function refreshUiInstant(){
  render();
}

async function loadStudiesFromSupabase(){
  if(!supabaseClient) return;
  const previousName=sel?.n||null;
  const previousStudyId=sel?.s?.[si]?.[4]||null;

  const {data,error}=await supabaseClient
    .from("studies")
    .select("*")
    .order("date",{ascending:false})
    .order("created_at",{ascending:false});

  if(error){
    console.error("Supabase studies:",error);
    throw error;
  }

  P=mapStudiesRows(data||[]);

  let next=previousName?P.find(p=>p.n===previousName):null;
  if(next&&previousStudyId){
    const wanted=next.s.findIndex(s=>String(s[4])===String(previousStudyId));
    if(wanted>=0) si=wanted; else si=0;
  }else{
    const available=getPatientsForDate(selectedDate);
    next=available[0]||P[0]||null;
    si=next?Math.max(0,next.s.findIndex(s=>s[0]===selectedDate)):0;
  }

  sel=next||null;
  img=1;

  await hydrateImageUrls();
}

async function restoreSession(){
  if(!supabaseClient) return;
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error || !data?.session?.user) return;
    const role=roleFromUser(data.session.user);
    if(!role){
      await supabaseClient.auth.signOut();
      return;
    }
    currentRole=role;
    logged=true;
    setViewerClass();
    await loadStudiesFromSupabase();
    render();
  }catch(e){
    console.error(e);
    toast("No se pudieron cargar los estudios.");
  }
}

async function logout(){
  try {
    if (supabaseClient) await supabaseClient.auth.signOut();
  } finally {
    logged = false;
    currentRole = "";
    setViewerClass();
    sel = null; si = 0; img = 1; scale = 1;
    home();
  }
}

function getPatientsForDate(date){
  return P.filter(p => Array.isArray(p.s) && p.s.some(s => s[0] === date));
}

function filteredPatients(date = selectedDate, term = searchTerm){
  const q = term.trim().toLowerCase();
  return getPatientsForDate(date).filter(p => !q || p.n.toLowerCase().includes(q));
}

function patientMatchesSearch(term){
  const q = term.trim().toLowerCase();
  if (!q) return [];
  return P.filter(p => p.n.toLowerCase().includes(q)).slice(0, 6);
}

function pb(list=filteredPatients()){
  if(!list.length)return `<div class="patient-empty">No hay pacientes registrados en esta fecha.</div>`;
  return list.map(p=>{
    const dayStudy=p.s.find(st=>st[0]===selectedDate);
    const icon=p.g==="M"?"👨":p.g==="F"?"👩":"👤";
    return `<button type="button" class="patient ${p.id===sel?.id?"active":""}" onclick='selectPatient(${JSON.stringify(p.id)})'>
      <strong>${icon} ${p.n}</strong>
      <span>${dayStudy?dayStudy[1]:"Ver historial"} · ${p.s.filter(st=>st[0]===selectedDate).reduce((a,st)=>a+Number(st[2]||0),0)} imágenes</span>
    </button>`;
  }).join("");
}
function searchSuggestions(){
  const items=patientMatchesSearch(searchTerm);
  if(!searchTerm.trim())return "";
  return `<div class="suggestions">${items.map(p=>`<button type="button" onclick='selectPatient(${JSON.stringify(p.id)});clearSearch()'>
    <strong>${p.g==='M'?'👨':p.g==='F'?'👩':'👤'} ${p.n}</strong>
    <span>${p.s.length} estudios · Ver historial</span>
  </button>`).join("")||`<div class="empty">No se encontraron pacientes.</div>`}</div>`;
}
function hist(){
  if (!sel || !Array.isArray(sel.s) || !sel.s.length) return `<div class="muted">No hay estudios registrados para este paciente.</div>`;
  let last = "", o = "";
  sel.s.forEach((x, i) => {
    if (x[0] !== last) { o += `<div class="day">${x[0]}</div>`; last = x[0]; }
    o += `<button class="study" onclick="study(${i})"><div><b>🩻 ${x[1]}</b><br>
      <span>${x[3] || ""} · <span class="ok">Disponible</span></span></div>
      <span>${x[2] || 0} imágenes ›</span></button>`;
  });
  return o;
}

  setViewerClass();

      <button type="button" class="add admin-action" data-action="add-patient">＋ Agregar paciente</button>
      <div class="patients">${pb()}</div>
    </aside>

const STUDIES=[

async function saveEditPatient(){
  if(currentRole!=="admin"){toast("Solo el Administrador puede modificar pacientes.");return;}
  if(!sel){toast("Selecciona un paciente primero para realizar esta acción.");return;}
  const newName=document.getElementById("eName").value.trim().toUpperCase();
  if(!newName){toast("El nombre del paciente es obligatorio.");return;}

  const oldName=sel.n;
  if(newName===oldName){closeModal("editModal");return;}

  const previousNames=new Map(P.map(p=>[p.id,p.n]));
  // UI optimistic: change immediately.
  P.forEach(p=>{if(p.n===oldName)p.n=newName;});
  sel.n=newName;
  closeModal("editModal");
  render();
  toast("Guardando cambios…");

  try{
    const {error}=await supabaseClient.from("studies").update({patient:newName}).eq("patient",oldName);
    if(error)throw error;
    toast("Paciente modificado correctamente.");
  }catch(err){
    console.error(err);
    P.forEach(p=>{const old=previousNames.get(p.id);if(old!==undefined)p.n=old;});
    sel=P.find(p=>p.id===sel?.id)||sel;
    if(sel)sel.n=oldName;
    render();
    toast(err?.message||"No se pudo guardar el cambio. Se restauró el nombre anterior.");
  }
}

function openDeleteImage(){
  if(currentRole!=="admin"){toast("Solo el Administrador puede eliminar imágenes.");return;}
  if(!sel){toast("Selecciona un paciente primero para realizar esta acción.");return;}
  const study=sel?.s?.[si];
  if(!study){toast("No hay estudio seleccionado.");return;}
  const items=Array.isArray(study[5])?study[5].slice():[];
  if(!items.length){toast("El estudio seleccionado no tiene imágenes.");return;}

  const deleteIndex=Math.max(0,Math.min(items.length-1,img-1));
  const deleted=items[deleteIndex];
  document.getElementById("confirmTitle").textContent="ELIMINAR IMAGEN";
  document.getElementById("confirmText").innerHTML=`¿Deseas eliminar la imagen <b>${deleteIndex+1}</b> del estudio <b>${study[1]}</b>?`;

  document.getElementById("confirmBtn").onclick=async()=>{
    closeModal("confirmModal");

    const previous=study[5].slice();
    const next=items.slice();
    next.splice(deleteIndex,1);

    // Optimistic UI: thumbnail disappears immediately.
    study[5]=next;
    study[2]=next.length;
    img=next.length?Math.min(deleteIndex+1,next.length):0;
    render();
    toast("Eliminando imagen…");

    try{
      const path=storageObjectPath(deleted);
      if(path){
        const storageResult=await storageRemove(path);
        if(storageResult.error)throw storageResult.error;
      }
      const {error}=await supabaseClient.from("studies").update({images:next}).eq("id",study[4]);
      if(error)throw error;
      if(deleted?.localUrl)try{URL.revokeObjectURL(deleted.localUrl)}catch(_){}
      toast("Imagen eliminada correctamente.");
    }catch(err){
      console.error(err);
      study[5]=previous;
      study[2]=previous.length;
      img=previous.length?Math.min(deleteIndex+1,previous.length):0;
      render();
      toast(err?.message||"No se pudo eliminar la imagen. Se restauró.");
    }
  };
  openModal("confirmModal");
}
function openDeletePatient(){
  if(currentRole!=="admin"){toast("Solo el Administrador puede eliminar pacientes.");return;}
  if(!sel){toast("Selecciona un paciente primero para realizar esta acción.");return;}

  const patientName=sel.n;
  const backupP=P.slice();
  const backupSel=sel;
  document.getElementById("confirmTitle").textContent="ELIMINAR PACIENTE";
  document.getElementById("confirmText").innerHTML=`¿Deseas eliminar al paciente <b>${patientName}</b>?`;
  document.getElementById("confirmBtn").onclick=async()=>{
    closeModal("confirmModal");

    // Optimistic UI: disappear immediately.
    P=P.filter(p=>p.n!==patientName);
    sel=null;si=0;img=1;
    render();
    toast("Paciente eliminado…");

    try{
      const {error}=await supabaseClient.from("studies").delete().eq("patient",patientName);
      if(error)throw error;
      toast("Paciente eliminado correctamente.");
    }catch(err){
      console.error(err);
      P=backupP;
      sel=backupSel;
      render();
      toast(err?.message||"No se pudo eliminar el paciente. Se restauró.");
    }
  };
  openModal("confirmModal");
}

async function saveImages(){
  if(currentRole!=="admin"){toast("Solo el Administrador puede añadir imágenes.");return;}
  if(!sel){toast("Selecciona un paciente primero para realizar esta acción.");return;}
  const study=sel?.s?.[si];
  if(!study){toast("Selecciona un estudio primero.");return;}
  const files=[...(addFiles||[])];
  if(!files.length){toast("Selecciona al menos una imagen.");return;}
  const studyId=study[4];
  if(!studyId){toast("No se pudo identificar el estudio.");return;}

  const existing=Array.isArray(study[5])?study[5].slice():[];
  const previews=files.map((f,i)=>makeLocalImageItem(f,i));
  const optimistic=[...existing,...previews];

  // Optimistic UI: show thumbnails and first image immediately.
  study[5]=optimistic;
  study[2]=optimistic.length;
  img=existing.length?1:1;
  closeModal("imagesModal");
  addFiles=[];
  render();
  toast(`${files.length} imagen${files.length>1?"es":""} añadida${files.length>1?"s":""}. Guardando…`);

  try{
    const uploaded=[];
    for(let i=0;i<files.length;i++){
      const file=files[i];
      const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const path=`studies/${studyId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeName}`;
      const up=await storageUpload(path,file);
      if(up.error)throw up.error;
      const url=await storageSignedUrl(path);
      uploaded.push({path,name:file.name,url});
    }

    const next=[...existing,...uploaded];
    const {error}=await supabaseClient.from("studies").update({images:next}).eq("id",studyId);
    if(error)throw error;

    revokeLocalImages(previews);
    study[5]=next;
    study[2]=next.length;
    img=existing.length?1:1;
    await hydrateImageUrls();
    render();
    toast(`${files.length} imagen${files.length>1?"es":""} guardada${files.length>1?"s":""} correctamente.`);
  }catch(err){
    console.error(err);
    revokeLocalImages(previews);
    study[5]=existing;
    study[2]=existing.length;
    img=existing.length?1:0;
    render();
    toast(err?.message||"No se pudieron guardar las imágenes. Se restauró el estado anterior.");
  }
}
function handleFiles(files,target){const arr=Array.from(files||[]);if(target==="patientFiles")patientFiles.push(...arr);else addFiles.push(...arr);renderFileList(target==="patientFiles"?patientFiles:addFiles,target);}
function renderFileList(arr,target){const el=document.getElementById(target);if(!el)return;el.innerHTML=arr.map(f=>`<div class="file-row"><span>🖼️ ${f.name}</span><span>${Math.round(f.size/1024)} KB</span></div>`).join("");}
function bindDrop(id,target){const d=document.getElementById(id);if(!d)return;["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("drag")}));["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("drag")}));d.addEventListener("drop",e=>handleFiles(e.dataTransfer.files,target));}
async function savePatient(){
  if(currentRole!=="admin"){toast("Solo el Administrador puede agregar pacientes.");return;}
  const name=document.getElementById("pName").value.trim().toUpperCase();
  const structure=getStudyValue("pStudyType");
  if(!name){toast("El nombre del paciente es obligatorio.");return;}
  if(!STUDIES.includes(structure)){toast("Selecciona una estructura / estudio.");return;}
  if(!supabaseClient){toast("No hay conexión con Supabase.");return;}

  const [d,mon,y]=selectedDate.split(" ");
  const months={ENE:"01",FEB:"02",MAR:"03",ABR:"04",MAY:"05",JUN:"06",JUL:"07",AGO:"08",SEP:"09",OCT:"10",NOV:"11",DIC:"12"};
  const studyDateISO=`${y}-${months[mon]}-${String(d).padStart(2,"0")}`;
  const modality=({TC:"TC",RM:"RM",MAMOGRAFÍA:"MAMOGRAFÍA",ECOGRAFÍA:"ECOGRAFÍA"}[structure]||"RX");
  const files=[...(patientFiles||[])];

  const buttons=[...document.querySelectorAll("#patientModal .modal-actions button")];
  buttons.forEach(b=>b.disabled=true);

  try{
    const {data,error}=await supabaseClient.from("studies").insert({
      patient:name,date:studyDateISO,study:structure,structure:structure,modality:modality,images:[]
    }).select("*").single();
    if(error)throw error;

    const uploaded=[];
    const localPreviews=files.map((f,i)=>makeLocalImageItem(f,i));

    // Put patient/study on screen immediately after the study row exists.
    data.images=localPreviews;
    upsertLocalStudy(data);
    sel=P.find(p=>p.n===name)||null;
    if(sel)si=Math.max(0,sel.s.findIndex(st=>String(st[4])===String(data.id)));
    img=files.length?1:0;
    closeModal("patientModal");
    patientFiles=[];
    render();

    // Upload in background, then replace previews with real Storage URLs.
    (async()=>{
      try{
        const uploaded=[];
        for(const file of files){
          const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
          const path=`studies/${data.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeName}`;
          const up=await storageUpload(path,file);
          if(up.error)throw up.error;
          const url=await storageSignedUrl(path);
          uploaded.push({path,name:file.name,url});
        }
        const {error:updateError}=await supabaseClient.from("studies").update({images:uploaded}).eq("id",data.id);
        if(updateError)throw updateError;

        revokeLocalImages(localPreviews);
        const localPatient=P.find(p=>p.n===name);
        const localStudy=localPatient?.s?.find(st=>String(st[4])===String(data.id));
        if(localStudy){
          localStudy[5]=uploaded;
          localStudy[2]=uploaded.length;
        }
        await hydrateImageUrls();
        if(sel?.n===name)img=uploaded.length?1:0;
        render();
        toast(uploaded.length?`${uploaded.length} imagen${uploaded.length>1?"es":""} guardada${uploaded.length>1?"s":""}.`:"Paciente agregado correctamente.");
      }catch(err){
        console.error(err);
        revokeLocalImages(localPreviews);
        const localPatient=P.find(p=>p.n===name);
        const localStudy=localPatient?.s?.find(st=>String(st[4])===String(data.id));
        if(localStudy){localStudy[5]=[];localStudy[2]=0;}
        render();
        toast(err?.message||"El paciente se creó, pero las imágenes no pudieron guardarse.");
      }
    })();

    toast(files.length?"Paciente agregado; mostrando las imágenes mientras se guardan…":"Paciente agregado correctamente.");
  }catch(err){
    console.error(err);
    toast(err?.message||"No se pudo guardar el paciente.");
  }finally{
    buttons.forEach(b=>b.disabled=false);
  }
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    document.querySelectorAll(".modal-bg.show").forEach(m=>m.classList.remove("show"));
    document.querySelectorAll(".study-options.show").forEach(x=>x.classList.remove("show"));
    document.getElementById("calendarPopup")?.classList.remove("show");
    document.getElementById("menu")?.classList.remove("show");
    document.getElementById("side")?.classList.remove("open");
    document.getElementById("overlay")?.classList.remove("show");
  }

  if(e.key==="Enter" && document.getElementById("loginModal")?.classList.contains("show")){
    const tag=(e.target?.tagName||"").toLowerCase();
    if(tag==="input" || tag==="button"){
      e.preventDefault();
      document.getElementById("loginSubmit")?.click();
    }
  }

  const active=document.activeElement;
  if(active?.classList.contains("study-search")){
    if(e.key.length===1 && /[a-zA-ZÁÉÍÓÚáéíóúÑñ ]/.test(e.key)){
      e.preventDefault();
      filterStudies(active.id.replace("Search",""),(active.value+e.key).toUpperCase());
    } else if(e.key==="Backspace"){
      e.preventDefault();
      filterStudies(active.id.replace("Search",""),active.value.slice(0,-1));
    }
  }
});

restoreSession();
home();
