<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACS — Hospital San Martin de Pangoa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#061015;--panel:#0b171d;--panel2:#102028;--line:#233943;--text:#eef8fa;--muted:#9cafb6;--blue:#168dcc;--cyan:#5ed2e5;--green:#62c79a;--danger:#ef6666}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,Arial,sans-serif;font-size:15px}button,input{font:inherit}button{cursor:pointer}
.screen{min-height:100vh;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 24%,#14313a,#061015 58%)}.center{padding:40px}.logo{font-size:62px}.center h1{font-size:28px;margin:12px 0 5px;font-weight:800}.center p{font-size:16px;color:var(--muted);margin:0 0 28px}.btn{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#021017;border:0;border-radius:11px;padding:13px 26px;font-weight:800}
.modal-bg{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:100}.modal-bg.show{display:grid}.modal{width:min(440px,92vw);background:var(--panel2);border:1px solid #31515d;border-radius:17px;padding:23px;box-shadow:0 30px 90px #0009}.mh{display:flex;justify-content:space-between;align-items:center}.mh b{font-size:20px}.close{background:none;border:0;color:var(--muted);font-size:25px}.field{margin:14px 0;text-align:left}.field label{display:block;font-size:14px;font-weight:600;margin-bottom:7px;color:#d5e3e7}.field input{width:100%;padding:12px 13px;border-radius:9px;border:1px solid var(--line);background:#071116;color:var(--text);outline:none}.checks{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:15px 0;color:#c9d8dc}.modal .btn{width:100%}
.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 25px;gap:22px;background:#08141a}.brand{min-width:320px}.brand b{display:block;font-size:20px;font-weight:800}.brand span{display:block;color:var(--cyan);font-size:14px;font-weight:600;margin-top:2px}.tr{margin-left:auto;display:flex;align-items:center;gap:10px}.search,.date{background:#071116;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 12px}.search{width:310px}.user{position:relative}.user>button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px}.menu{display:none;position:absolute;right:0;top:48px;width:200px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px;z-index:40;box-shadow:0 18px 50px #0007}.menu.show{display:block}.menu b{display:block;padding:9px;color:var(--cyan)}.menu button{width:100%;text-align:left;background:none;border:0;color:var(--text);padding:10px;border-radius:7px}.menu button:hover{background:#172b34}
.layout{display:grid;grid-template-columns:245px minmax(620px,1fr) 265px;min-height:calc(100vh - 76px)}.left,.right{background:var(--panel);padding:18px}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.title{font-size:15px;font-weight:800;letter-spacing:.2px}.subhead{color:var(--cyan);font-size:14px;font-weight:700;margin-top:4px}.muted{color:var(--muted);font-size:14px}.add{width:100%;margin:13px 0;padding:10px;border-radius:9px;border:1px solid var(--blue);background:#0d2a38;color:#e8fbff;font-weight:700}.patients{display:flex;flex-direction:column;gap:7px}.patient{background:none;border:1px solid transparent;color:var(--text);padding:11px;border-radius:9px;text-align:left}.patient:hover,.patient.active{background:#11262f;border-color:#2a5262}.patient strong{display:block;font-size:16px;font-weight:700}.patient span{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.viewer{background:#040a0e;display:flex;flex-direction:column;min-width:0}.vh{height:50px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 16px}.vh b{font-size:16px}.vh span{color:var(--cyan);font-size:14px;font-weight:700}.image{flex:1;min-height:calc(100vh - 76px - 50px - 44px - 64px);display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,#172c34,#040a0e 68%);touch-action:none}.xray{width:76%;height:84%;max-width:900px;border-radius:14px;object-fit:contain;background:#050b0f;filter:grayscale(1) contrast(1.18);box-shadow:0 0 60px #000}.tools{display:flex;justify-content:center;gap:6px;height:44px;padding:5px;border-top:1px solid var(--line);background:#071116}.tool{width:38px;height:34px;border:1px solid var(--line);border-radius:8px;background:#0e1d24;color:var(--text)}.tool:hover{border-color:var(--cyan);color:var(--cyan)}.thumbs{height:64px;display:flex;gap:8px;padding:9px 14px;overflow:hidden;border-top:1px solid var(--line);background:#081217;justify-content:flex-start}.thumb{min-width:70px;height:45px;background:#263940;color:var(--text);border:1px solid var(--line);border-radius:7px;font-size:13px}.thumb.active{border:2px solid var(--cyan);box-shadow:0 0 10px #5ed2e533}
.info{padding:12px 0 16px;border-bottom:1px solid var(--line)}.info h2{font-size:18px;margin:7px 0 10px}.kv{font-size:14px;color:var(--muted);line-height:1.85}.ok{color:var(--green);font-weight:700}.actions{display:flex;flex-direction:column;gap:7px;margin-top:12px}.action{background:#0e1d24;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left}.action:hover{border-color:var(--cyan)}.danger{color:#ff9d9d;border-color:#5a3034}.history{padding:25px;max-width:1200px;margin:auto}.history h2{font-size:19px;margin:0 0 15px;color:var(--cyan)}.day{color:var(--cyan);font-weight:800;font-size:14px;margin:17px 0 8px}.study{width:100%;display:flex;justify-content:space-between;text-align:left;background:#0d1b21;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:7px}.study:hover{border-color:var(--blue)}.study span{color:var(--muted);font-size:14px}.mobile-nav,.side,.overlay{display:none}
@media(max-width:850px){body{font-size:15px}.top{height:62px;padding:0 14px}.brand{min-width:0}.brand b{font-size:16px}.brand span{font-size:12px}.tr{display:none}.layout{display:block;min-height:calc(100vh - 62px);padding-bottom:64px}.left,.right{display:none}.viewer{min-height:calc(100vh - 62px)}.image{height:calc(100vh - 62px - 50px - 44px - 64px);min-height:400px}.xray{width:82%;height:62%;max-width:none}.tools{justify-content:flex-start;overflow:hidden}.history{padding:18px 14px}.mobile-nav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;height:64px;background:#0a151a;border-top:1px solid var(--line);z-index:50}.mobile-nav button{background:none;border:0;color:var(--muted);font-size:12px}.mobile-nav .active{color:var(--cyan)}.mobile-nav span{display:block;font-size:20px;margin-bottom:2px}.side{display:block;position:fixed;z-index:80;left:0;top:0;bottom:0;width:min(88vw,360px);background:var(--panel);border-right:1px solid var(--line);padding:16px;transform:translateX(-105%);transition:.22s;overflow:auto}.side.open{transform:translateX(0)}.side input{width:100%;padding:11px;background:#071116;border:1px solid var(--line);color:var(--text);border-radius:9px;margin:10px 0}.overlay.show{display:block;position:fixed;inset:0;background:#0008;z-index:70}}

.search-wrap{position:relative}.search-wrap #searchResults{position:absolute;left:0;right:0;top:46px;z-index:60}.suggestions{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 18px 50px #0008}.suggestions button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:11px 13px;border-bottom:1px solid var(--line)}.suggestions button:hover{background:#172b34}.suggestions strong{display:block}.suggestions span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.suggestions .empty{padding:12px;color:var(--muted);font-size:13px}

.thumb{flex:1 1 0;min-width:0;max-width:110px;height:48px;padding:0;overflow:hidden;position:relative;background:#111d22;border:1px solid var(--line);border-radius:7px}
.thumb img{width:100%;height:100%;display:block;object-fit:cover;opacity:.86}
.thumb span{position:absolute;left:4px;bottom:3px;background:#061015cc;color:#fff;border-radius:4px;padding:1px 4px;font-size:10px}
.thumb.active{border:2px solid var(--cyan);box-shadow:0 0 12px #5ed2e544}

.date-wrap{position:relative}.date-field{min-width:190px;background:#071116;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:600}.date-field:hover{border-color:var(--cyan)}.date-chevron{margin-left:auto;color:var(--muted)}
.calendar-popup{display:none;position:absolute;right:0;top:48px;width:315px;background:var(--panel2);border:1px solid #31515d;border-radius:14px;padding:14px;z-index:80;box-shadow:0 24px 70px #000b}.calendar-popup.show{display:block}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cal-title{font-weight:800;color:var(--text)}.cal-nav{background:#0d1d24;border:1px solid var(--line);color:var(--text);border-radius:7px;width:32px;height:30px}.cal-nav:hover{border-color:var(--cyan);color:var(--cyan)}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-week{font-size:11px;color:var(--muted);text-align:center;padding:5px 0;font-weight:700}.cal-day{height:34px;border:0;background:transparent;color:var(--text);border-radius:7px}.cal-day:hover{background:#17313b}.cal-day.muted-day{color:#53676f}.cal-day.has-study{color:var(--cyan);font-weight:800;position:relative}.cal-day.has-study:after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--green)}.cal-day.selected{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#031016}.cal-day.selected:after{background:#fff}.cal-note{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.cal-note b{color:var(--green)}
@media(max-width:850px){.calendar-popup{position:fixed;top:70px;left:50%;right:auto;transform:translateX(-50%);width:min(315px,92vw)}.date-field{min-width:0}}

.modal-bg{backdrop-filter:blur(3px)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}
.field textarea{width:100%;min-height:80px;padding:12px;border-radius:9px;border:1px solid var(--line);background:#071116;color:var(--text);resize:vertical}
.field select{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#071116;color:var(--text)}
.optional{font-size:12px;color:var(--muted);font-weight:400}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.secondary{background:#0e1d24;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 16px;font-weight:700}
.dropzone{border:1.5px dashed #3d6674;border-radius:12px;padding:22px;text-align:center;background:#09171d;color:var(--muted);transition:.15s}.dropzone.drag{border-color:var(--cyan);background:#0d2832}.dropzone b{display:block;color:var(--text);margin-bottom:5px}.file-list{margin-top:10px;max-height:130px;overflow:auto}.file-row{display:flex;justify-content:space-between;gap:10px;padding:7px 9px;background:#0d1b21;border:1px solid var(--line);border-radius:7px;margin-top:5px;font-size:13px}.file-row span:last-child{color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;z-index:200;background:#10252d;border:1px solid #376170;color:var(--text);padding:12px 16px;border-radius:10px;box-shadow:0 15px 40px #0008;display:none}.toast.show{display:block}.viewer-only .admin-action{display:none}
@media(max-width:650px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.modal{max-height:90vh;overflow:auto}}

.modal{width:min(920px,calc(100vw - 32px));max-width:920px}
.modal-bg .modal{padding:20px}
.modal-bg .form-grid{grid-template-columns:repeat(4,minmax(0,1fr));align-items:end}
.modal-bg .form-grid .full{grid-column:1/-1}
.modal-bg .field label{display:block;margin-bottom:6px}
#patientModal .modal{width:min(860px,calc(100vw - 32px))}
#patientModal .form-grid{grid-template-columns:1.15fr .85fr 1fr 1fr;gap:13px}
#patientModal .field.name-field{grid-column:1/-1}
#patientModal .field.study-field{grid-column:1/-1}
#patientModal .dropzone{min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.18s ease}
#patientModal .dropzone:hover{border-color:var(--cyan);background:#0d2832;box-shadow:0 0 0 2px #5ed2e51a,0 10px 28px #0006;transform:translateY(-1px)}
#patientModal .study-search-wrap{position:relative}
#patientModal .study-search{cursor:text;transition:.18s ease}
#patientModal .study-search:hover,#patientModal .study-search:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #5ed2e51a}
#patientModal .study-search-wrap:after{content:"▾";position:absolute;right:13px;top:11px;color:var(--muted);pointer-events:none;font-size:15px}
#patientModal .study-options button{cursor:pointer;transition:.12s ease}
#patientModal .study-options button:hover{background:#17313b;box-shadow:inset 3px 0 0 var(--cyan)}
#patientModal .modal-actions{margin-top:16px}
.study-search-wrap{position:relative}
.study-search{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#071116;color:var(--text);text-transform:uppercase}
.study-options{position:absolute;left:0;right:0;top:46px;z-index:120;background:var(--panel2);border:1px solid var(--line);border-radius:9px;max-height:220px;overflow:auto;display:none;box-shadow:0 15px 40px #0009}
.study-options.show{display:block}
.study-options button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:10px 12px}
.study-options button:hover{background:#17313b;color:var(--cyan)}
.study-selected{margin-top:6px;font-size:12px;color:var(--muted)}
@media(max-width:900px){.modal-bg .form-grid{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.modal{width:calc(100vw - 20px)}.modal-bg .form-grid{grid-template-columns:1fr}}

.dropzone{cursor:pointer;transition:.18s ease}.dropzone:hover{border-color:var(--cyan);background:#0d2832;box-shadow:0 0 0 2px #5ed2e51a,0 10px 28px #0006;transform:translateY(-1px)}
.action,.btn,.secondary,.close,.date-field,.cal-nav{cursor:pointer}

.study-search-wrap{position:relative;width:100%}
.study-search{width:100%;padding:12px 38px 12px 12px;border-radius:9px;border:1px solid var(--line);background:#071116;color:var(--text);text-transform:uppercase;cursor:pointer;caret-color:var(--cyan);transition:.18s ease}
.study-search:hover,.study-search:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #5ed2e51a,0 8px 22px #0005;outline:none}
.study-search-wrap:after{content:"▾";position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:15px}
.study-options{position:absolute;left:0;right:0;top:48px;z-index:150;background:var(--panel2);border:1px solid var(--line);border-radius:9px;max-height:220px;overflow:auto;display:none;box-shadow:0 18px 45px #0009}
.study-options.show{display:block}
.study-options button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:10px 12px;cursor:pointer;transition:.12s ease}
.study-options button:hover,.study-options button:focus{background:#17313b;color:var(--cyan);box-shadow:inset 3px 0 0 var(--cyan);outline:none}
#confirmModal .modal,#loginModal .modal{width:min(420px,calc(100vw - 32px));max-width:420px}
#confirmModal .modal{padding:18px}
#confirmModal #confirmText{font-size:14px;margin:8px 0 4px}
#confirmModal .btn,#confirmModal .secondary{padding:9px 14px}
.email-field{display:flex;align-items:stretch}.email-field input{border-radius:9px;flex:1;min-width:0}

.study-search-wrap{cursor:pointer}
.study-search-wrap .study-search{cursor:pointer}
.study-search-wrap .study-options button{cursor:pointer}
.study-search-wrap:hover .study-search{border-color:var(--cyan);box-shadow:0 0 0 2px #5ed2e51a,0 8px 22px #0005}

.study-search{cursor:pointer!important}
.study-search-wrap,.study-search-wrap *{cursor:pointer}
.study-search:focus{cursor:pointer!important}

#imagesModal .study-search-wrap{width:100%;cursor:pointer}
#imagesModal .study-search{cursor:pointer!important}
#imagesModal .study-search-wrap:hover .study-search{border-color:var(--cyan);box-shadow:0 0 0 2px #5ed2e51a,0 8px 22px #0005}
#imagesModal .study-options{max-height:240px}

.modal-bg .modal{outline:none}
.btn:disabled{opacity:.65;cursor:wait}
.data-loading{padding:16px;color:var(--muted);text-align:center;font-size:13px}

.study-picker-btn{width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--line);background:#071116;color:var(--text);display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer;transition:.18s ease}
.study-picker-btn:hover,.study-picker-btn:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #5ed2e51a,0 8px 22px #0005;outline:none}
.study-picker-arrow{color:var(--muted);font-size:15px}
.study-option{width:100%;text-align:left;border:0;background:none;color:var(--text);padding:10px 12px;cursor:pointer}
.study-option:hover,.study-option:focus{background:#17313b;color:var(--cyan);outline:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="root"></div>

<div id="patientModal" class="modal-bg"><div class="modal">
<div class="mh"><b id="patientModalTitle">AGREGAR PACIENTE</b><button class="close" onclick="closeModal('patientModal')">×</button></div>
<div class="form-grid">
<div class="field name-field"><label>NOMBRE COMPLETO</label><input id="pName" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" placeholder="NOMBRE Y APELLIDOS" autocomplete="off"></div>
<div class="field"><label>DNI <span class="optional">(OPCIONAL)</span></label><input id="pDni" inputmode="numeric" maxlength="8" placeholder="DNI"></div>
<div class="field"><label>SEXO <span class="optional">(OPCIONAL)</span></label><select id="pSex"><option value="">NO ESPECIFICADO</option><option value="M">MASCULINO</option><option value="F">FEMENINO</option></select></div>
<div class="field"><label>FECHA DE NACIMIENTO <span class="optional">(OPCIONAL)</span></label><input id="pBirth" type="date"></div>
<div class="field"><label>FECHA DEL ESTUDIO</label><div class="muted" id="pStudyDate">14 AGO 2026</div></div>
<div class="field study-field"><label>ESTRUCTURA / ESTUDIO</label><div id="pStudyType"></div></div>
<div class="field full"><label>IMÁGENES</label>
<div class="dropzone" id="pDrop" onclick="document.getElementById('pFiles').click()"><b>📎 SELECCIONAR IMÁGENES</b><span>O ARRASTRA UNA O VARIAS IMÁGENES AQUÍ</span></div>
<input id="pFiles" type="file" accept="image/*,.dcm" multiple hidden onchange="handleFiles(this.files,'patientFiles')"><div class="file-list" id="patientFiles"></div></div>
</div>
<div class="modal-actions"><button class="secondary" onclick="closeModal('patientModal')">CANCELAR</button><button class="btn" onclick="savePatient()">AGREGAR PACIENTE</button></div>
</div></div>

<div id="editModal" class="modal-bg"><div class="modal">
<div class="mh"><b>MODIFICAR PACIENTE</b><button class="close" onclick="closeModal('editModal')">×</button></div>
<div class="form-grid">
<div class="field full">
<label>NOMBRE COMPLETO</label>
<input id="eName" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" autocomplete="off">
</div>
<div class="field">
<label>DNI <span class="optional">(OPCIONAL)</span></label>
<input id="eDni" inputmode="numeric" maxlength="8" placeholder="SIN MODIFICAR">
</div>
<div class="field">
<label>SEXO <span class="optional">(OPCIONAL)</span></label>
<select id="eSex">
<option value="">NO MODIFICAR</option>
<option value="M">MASCULINO</option>
<option value="F">FEMENINO</option>
</select>
</div>
<div class="field">
<label>FECHA DE NACIMIENTO <span class="optional">(OPCIONAL)</span></label>
<input id="eBirth" type="date">
</div>
</div>
<div class="modal-actions">
<button class="secondary" onclick="closeModal('editModal')">CANCELAR</button>
<button class="btn" onclick="saveEditPatient()">GUARDAR CAMBIOS</button>
</div>
</div></div>

<div id="imagesModal"<div id="imagesModal" class="modal-bg"><div class="modal">
<div class="mh"><b>Añadir imágenes</b><button class="close" onclick="closeModal('imagesModal')">×</button></div>
<div class="field"><label>Paciente</label><input id="aPatient" readonly></div>
<div class="field full"><label>ESTRUCTURA / ESTUDIO</label><div id="aStudyType" title="Haz clic para ver todas las estructuras"></div></div>
<div class="field"><label>Fecha del estudio</label><input id="aStudyDate" readonly></div>
<div class="field"><label>Imágenes <span class="optional">(puedes seleccionar varias)</span></label>
<div class="dropzone" id="aDrop" onclick="document.getElementById('aFiles').click()"><b>📎 Seleccionar imágenes</b>o arrastra una o varias imágenes aquí</div>
<input id="aFiles" type="file" accept="image/*,.dcm" multiple hidden onchange="handleFiles(this.files,'addFiles')"><div class="file-list" id="addFiles"></div></div>
<div class="modal-actions"><button class="secondary" onclick="closeModal('imagesModal')">Cancelar</button><button class="btn" onclick="saveImages()">Añadir imágenes</button></div>
</div></div>

<div id="confirmModal" class="modal-bg"><div class="modal">
<div class="mh"><b id="confirmTitle">Confirmar</b><button class="close" onclick="closeModal('confirmModal')">×</button></div>
<p id="confirmText" style="color:var(--muted);line-height:1.6"></p>
<div class="modal-actions"><button class="secondary" onclick="closeModal('confirmModal')">Cancelar</button><button class="btn" id="confirmBtn">Confirmar</button></div>
</div></div>

<script>

const SUPABASE_CONFIG = {
  url: 'https://tapjgdzwmsfgthxncero.supabase.co',
  anonKey: 'sb_publishable_5L4-txz5pZzI6dU6UAw86w_5gXbHZr0'
};

const ROLE_UIDS = {
  admin: "622de888-2abd-4f4c-b1ba-488c7472b767",
  viewer: "070c65c4-b499-4a45-ba7f-f2d5525a1d48"

let supabaseClient = null;

let selectedDate = "14 AGO 2026", searchTerm = "", currentRole = "";

function initSupabase(){
  if (!window.supabase || !SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) return false;
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

function roleFromUser(user){
  const uid = user?.id || "";
  if (uid === ROLE_UIDS.admin) return "admin";
  if (uid === ROLE_UIDS.viewer) return "viewer";
  return "";
}

function setViewerClass(){
  document.body.classList.toggle("viewer-only", currentRole === "viewer");
}

function loadRememberedUser(){
  try {
    const saved = localStorage.getItem("pacsRememberedUser");
    const el = document.getElementById("loginEmail");
    if (saved && el) el.value = saved;
  } catch (_) {}
}

function home(){
  root.innerHTML = `<div class="screen"><div class="center"><div class="logo">🏥</div>
  <h1>HOSPITAL SAN MARTIN DE PANGOA</h1><p>DIAGNÓSTICO POR IMAGEN</p>
  <button class="btn" onclick="openLogin()">Iniciar sesión</button></div></div>`;
}

function openLogin(){
  const status = document.getElementById("loginStatus");
  if (status) status.textContent = "";
  loadRememberedUser();
  document.getElementById("loginPass").value = "";
  document.getElementById("loginModal")?.classList.add("show");
}

function openModal(id){ document.getElementById(id)?.classList.add("show"); }
function closeModal(id){ document.getElementById(id)?.classList.remove("show"); }

async function doLogin(){
  const email = (document.getElementById("loginEmail")?.value || "").trim();
  const pass = (document.getElementById("loginPass")?.value || "").trim();
  const status = document.getElementById("loginStatus");
  if (status) status.textContent = "";

  if (!email) { if (status) status.textContent = "Escribe tu correo."; return; }
  if (!pass) { if (status) status.textContent = "Escribe tu contraseña."; return; }
  if (!supabaseClient) {
    if (status) status.textContent = "No se pudo inicializar la conexión con Supabase.";
    return;
  }

  const btn = document.getElementById("loginSubmit");
  if (btn) { btn.disabled = true; btn.textContent = "VERIFICANDO…"; }

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: pass
    });

    if (error || !data?.user) {
      if (status) status.textContent = "Correo o contraseña incorrectos.";
      return;
    }

    const role = roleFromUser(data.user);
    if (!role) {
      await supabaseClient.auth.signOut();
      if (status) status.textContent = "Este usuario no tiene acceso autorizado al PACS.";
      return;
    }

    currentRole = role;
    logged = true;
    setViewerClass();

    try {
      if (document.getElementById("rememberUser")?.checked) {
        localStorage.setItem("pacsRememberedUser", email);
      }
    } catch (_) {}

    closeModal("loginModal");
    render();
  } catch (e) {
    console.error(e);
    if (status) status.textContent = "No se pudo conectar con Supabase.";
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "INICIAR SESIÓN"; }
  }
}


function parseStudyImagesCount(value){
  if (Array.isArray(value)) return value.length;
  if (typeof value === "number" && Number.isFinite(value)) return value;
  if (typeof value === "string"){
    const v=value.trim();
    if(!v) return 0;
    if(/^\d+$/.test(v)) return Number(v);
    try{
      const parsed=JSON.parse(v);
      if(Array.isArray(parsed)) return parsed.length;
      if(parsed && typeof parsed==="object"){
        if(Array.isArray(parsed.images)) return parsed.images.length;
        if(Number.isFinite(Number(parsed.count))) return Number(parsed.count);
      }
    }catch(_){}
  }
  if(value && typeof value==="object"){
    if(Array.isArray(value.images)) return value.images.length;
    if(Number.isFinite(Number(value.count))) return Number(value.count);
  }
  return 0;
}

function normalizeStudyDate(v){
  if(!v) return "";
  const d = new Date(v);
  if(Number.isNaN(d.getTime())) return String(v).toUpperCase();
  const months=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  return `${String(d.getDate()).padStart(2,"0")} ${months[d.getMonth()]} ${d.getFullYear()}`.toUpperCase();
}

function mapStudiesRows(rows){
  const groups = new Map();
  (rows||[]).forEach((r,idx)=>{
    const patient = String(r.patient||"").trim().toUpperCase();
    if(!patient) return;
    const date = normalizeStudyDate(r.date);
    const structure = String(r.structure||r.study||"").trim().toUpperCase();
    const studyName = String(r.study||structure||r.modality||"ESTUDIO").trim().toUpperCase();
    const imagesCount = parseStudyImagesCount(r.images);
    const key = patient;
    if(!groups.has(key)){
      groups.set(key,{id:r.patient_id||`p-${idx}-${patient}`,n:patient,g:r.sex||r.gender||"U",s:[]});
    }
    groups.get(key).s.push([date,structure||studyName,imagesCount,r.created_at?new Date(r.created_at).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}):""]);
  });
  return Array.from(groups.values()).map(p=>{
    p.s.sort((a,b)=>{
      const da=a[0],db=b[0];
      return db.localeCompare(da);
    });
    return p;
  });
}

async function loadStudiesFromSupabase(){
  if(!supabaseClient) return;
  const {data,error}=await supabaseClient
    .from("studies")
    .select("*")
    .order("date",{ascending:false})
    .order("created_at",{ascending:false});
  if(error){
    console.error("Supabase studies:",error);
    throw error;
  }
  P = mapStudiesRows(data||[]);
  if(P.length){
    const available=getPatientsForDate(selectedDate);
    sel = available[0] || P[0];
    const idx=sel?.s?.findIndex(s=>s[0]===selectedDate) ?? -1;
    si=idx>=0?idx:0;
    img=1;
  }else{
    sel=null; si=0; img=1;
  }
}

async function restoreSession(){
  if (!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient.auth.getSession();
    if (error || !data?.session?.user) return;

    const role = roleFromUser(data.session.user);
    if (!role) {
      await supabaseClient.auth.signOut();
      return;
    }

    currentRole = role;
    logged = true;
    setViewerClass();
    render();
  } catch (e) {
    console.error(e);
  }
}

async function logout(){
  try {
    if (supabaseClient) await supabaseClient.auth.signOut();
  } finally {
    logged = false;
    currentRole = "";
    setViewerClass();
    sel = null; si = 0; img = 1; scale = 1;
    home();
  }
}

function getPatientsForDate(date){
  return P.filter(p => Array.isArray(p.s) && p.s.some(s => s[0] === date));
}

function filteredPatients(date = selectedDate, term = searchTerm){
  const q = term.trim().toLowerCase();
  return getPatientsForDate(date).filter(p => !q || p.n.toLowerCase().includes(q));
}

function patientMatchesSearch(term){
  const q = term.trim().toLowerCase();
  if (!q) return [];
  return P.filter(p => p.n.toLowerCase().includes(q)).slice(0, 6);
}

function pb(list = filteredPatients()){
  if (!list.length) return `<div class="muted" style="padding:12px 4px">No hay pacientes registrados en esta fecha.</div>`;
  return list.map(p => `<button class="patient ${p.id == sel?.id ? 'active' : ''}" onclick="pick(${p.id})">
    <strong>${p.g === 'M' ? '👨' : p.g === 'F' ? '👩' : '👤'} ${p.n}</strong>
    <span>${p.s.find(s => s[0] === selectedDate)?.[1] || 'Ver historial'} · ${p.s.filter(s => s[0] === selectedDate).reduce((a,s) => a + (Number(s[2]) || 0), 0)} imágenes</span>
  </button>`).join("");
}

function searchSuggestions(){
  const items = patientMatchesSearch(searchTerm);
  if (!searchTerm.trim()) return "";
  return `<div class="suggestions">${items.map(p => `<button onclick="pick(${p.id});clearSearch()">
    <strong>${p.g === 'M' ? '👨' : p.g === 'F' ? '👩' : '👤'} ${p.n}</strong>
    <span>${p.s.length} estudios · Ver historial</span></button>`).join("") || `<div class="empty">No se encontraron pacientes.</div>`}</div>`;
}

function hist(){
  if (!sel || !Array.isArray(sel.s) || !sel.s.length) return `<div class="muted">No hay estudios registrados para este paciente.</div>`;
  let last = "", o = "";
  sel.s.forEach((x, i) => {
    if (x[0] !== last) { o += `<div class="day">${x[0]}</div>`; last = x[0]; }
    o += `<button class="study" onclick="study(${i})"><div><b>🩻 ${x[1]}</b><br>
      <span>${x[3] || ""} · <span class="ok">Disponible</span></span></div>
      <span>${x[2] || 0} imágenes ›</span></button>`;
  });
  return o;
}

function render(){
  if (!logged) { home(); return; }
  setViewerClass();

  const x = sel?.s?.[si] || ["", "", 0, ""];
  const patientName = sel?.n || "SIN PACIENTE SELECCIONADO";
  const roleLabel = currentRole === "admin" ? "Administrador" : "Visualizador";

  root.innerHTML = `<header class="top">
    <div class="brand"><b>HOSPITAL SAN MARTIN DE PANGOA</b><span>DIAGNÓSTICO POR IMAGEN</span></div>
    <div class="tr">
      <div class="search-wrap"><input id="topSearch" class="search" value="" oninput="searchTerm=this.value;renderSearch()" placeholder="🔎 Buscar paciente..."><div id="searchResults"></div></div>
      <div class="date-wrap"><button class="date-field" id="dateField" onclick="toggleCalendar(event)">📅 <span id="dateLabel">${selectedDate}</span><span class="date-chevron">▾</span></button><div id="calendarPopup" class="calendar-popup" onclick="event.stopPropagation()"></div></div>
      <div class="user"><button id="userButton" onclick="menu.classList.toggle('show')">👤 ${roleLabel} ▾</button>
        <div id="menu" class="menu"><b>${roleLabel}</b><button onclick="logout()">🔐 Cerrar sesión</button></div>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="left">
      <div class="title">PACIENTES DEL DÍA</div><div class="subhead">${selectedDate}</div>
      <div class="muted">${getPatientsForDate(selectedDate).length} pacientes con estudios</div>
      <button class="add admin-action" onclick="openAddPatient()">＋ Agregar paciente</button>
      <div class="patients">${pb()}</div>
    </aside>

    <section class="viewer">
      <div class="vh"><b>${x[1] || "VISOR DE IMÁGENES"}</b><span>${x[2] ? img + " / " + x[2] : ""}</span></div>
      <div class="image" id="image"><div class="xray" id="xray" style="transform:scale(${scale})"></div></div>
      <div class="tools"><button class="tool" onclick="tool(0)">−</button><button class="tool" onclick="tool(1)">＋</button><button class="tool">✋</button><button class="tool">↻</button><button class="tool">☀</button><button class="tool">◑</button><button class="tool" onclick="tool(6)">↩</button><button class="tool" onclick="document.getElementById('image').requestFullscreen?.()">⛶</button></div>
      <div class="thumbs"></div>
    </section>

    <aside class="right">
      <div class="title">PACIENTE SELECCIONADO</div>
      <div class="info"><h2>${sel ? (sel.g === 'M' ? '👨' : sel.g === 'F' ? '👩' : '👤') + ' ' + sel.n : patientName}</h2>
      <div class="kv">Estudio actual<br><b style="color:var(--text)">${x[1] || "—"}</b><br>📅 ${x[0] || "—"}<br>🕐 ${x[3] || "—"}<br>🖼️ ${x[2] || 0} imágenes<br><span class="ok">● Disponible</span></div></div>
      <div class="title subhead" style="margin-top:18px">ACCIONES</div>
      <div class="actions">
        <button class="action admin-action" onclick="openEditPatient()">✏️ Modificar paciente</button>
        <button class="action admin-action" onclick="openAddImages()">➕ Añadir imágenes</button>
        <button class="action admin-action" onclick="openDeleteImage()">🗑️ Eliminar imagen</button>
        <button class="action danger admin-action" onclick="openDeletePatient()">🔴 ✕ Eliminar paciente</button>
      </div>
    </aside>
  </main>

  <section class="history"><h2>HISTORIAL DEL PACIENTE · ${patientName}</h2>${hist()}</section>
  <nav class="mobile-nav"><button class="active"><span>🏠</span>Inicio</button><button onclick="openSide()"><span>👥</span>Pacientes</button><button onclick="scrollTo({top:0,behavior:'smooth'})"><span>🩻</span>Visor</button></nav>
  <div id="overlay" class="overlay" onclick="closeSide()"></div>
  <aside id="side" class="side"><div style="display:flex;justify-content:space-between"><b>← PACIENTES</b><button class="close" onclick="closeSide()">×</button></div>
    <input placeholder="🔎 Buscar paciente..."><button class="add admin-action" onclick="openAddPatient()">＋ Agregar paciente</button><div class="patients">${pb()}</div>
  </aside>`;

  gesture();
  const ts = document.getElementById("topSearch");
  if (ts) { ts.value = searchTerm; renderSearch(); }
}

function renderSearch(){
  const box = document.getElementById("searchResults");
  if (box) box.innerHTML = searchSuggestions();
}

function clearSearch(){
  searchTerm = "";
  const input = document.getElementById("topSearch");
  if (input) input.value = "";
  renderSearch();
}

function pick(id){
  sel = P.find(p => p.id == id) || null;
  if (sel) {
    const idx = sel.s.findIndex(s => s[0] === selectedDate);
    si = idx >= 0 ? idx : 0;
  }
  img = 1; scale = 1; closeSide(); render();
}

function study(i){ if (!sel) return; si = i; img = 1; scale = 1; render(); }
function tool(i){ if (i===0) scale=Math.max(.5,scale-.15); if(i===1) scale=Math.min(2.5,scale+.15); if(i===6) scale=1; render(); }
function openSide(){ side.classList.add("open"); overlay.classList.add("show"); }
function closeSide(){ document.getElementById("side")?.classList.remove("open"); document.getElementById("overlay")?.classList.remove("show"); }

const MONTHS=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
const WD=["L","M","M","J","V","S","D"];
let calYear=2026,calMonth=7;
function dateToLabel(y,m,d){ return `${String(d).padStart(2,"0")} ${MONTHS[m].slice(0,3)} ${y}`; }
function dateKey(y,m,d){ return dateToLabel(y,m,d); }
function dateHasStudies(y,m,d){ return P.some(p => p.s?.some(s => s[0] === dateKey(y,m,d))); }
function parseSelectedDate(){ const [d,mon,y]=selectedDate.split(" "); const m=MONTHS.findIndex(x=>x.startsWith(mon)); return {y:Number(y),m,d:Number(d)}; }
function toggleCalendar(e){ e?.stopPropagation(); const p=document.getElementById("calendarPopup"); if(!p)return; if(p.classList.contains("show")){p.classList.remove("show");return} const cur=parseSelectedDate(); calYear=cur.y;calMonth=cur.m;drawCalendar();p.classList.add("show"); }
function drawCalendar(){ const p=document.getElementById("calendarPopup");if(!p)return;const first=new Date(calYear,calMonth,1);let start=(first.getDay()+6)%7;const days=new Date(calYear,calMonth+1,0).getDate();const prevDays=new Date(calYear,calMonth,0).getDate();let cells="";WD.forEach(w=>cells+=`<div class="cal-week">${w}</div>`);for(let i=0;i<42;i++){let d=i-start+1,y=calYear,m=calMonth,muted=false;if(d<1){d=prevDays+d;m=calMonth-1;muted=true;if(m<0){m=11;y--}}else if(d>days){d=d-days;m=calMonth+1;muted=true;if(m>11){m=0;y++}}const key=dateKey(y,m,d),selected=key===selectedDate,has=dateHasStudies(y,m,d);cells+=`<button class="cal-day ${muted?'muted-day':''} ${selected?'selected':''} ${has?'has-study':''}" onclick="chooseCalendarDate(${y},${m},${d})">${d}</button>`;}p.innerHTML=`<div class="cal-head"><button class="cal-nav" onclick="moveCalendar(-1)">‹</button><div class="cal-title">${MONTHS[calMonth]} ${calYear}</div><button class="cal-nav" onclick="moveCalendar(1)">›</button></div><div class="cal-grid">${cells}</div><div class="cal-note"><b>●</b> Hay estudios registrados en esa fecha</div>`; }
function moveCalendar(delta){calMonth+=delta;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}drawCalendar();}
function chooseCalendarDate(y,m,d){selectedDate=dateKey(y,m,d);const available=getPatientsForDate(selectedDate);sel=available[0]||null;si=0;img=1;scale=1;render();}

const STUDIES=["TÓRAX","COLUMNA CERVICAL","COLUMNA DORSAL","COLUMNA LUMBAR","COLUMNA COMPLETA","PELVIS","CADERA","ABDOMEN","CRÁNEO","SENOS PARANASALES","HOMBRO","CODO","ANTEBRAZO","MUÑECA","MANO","RODILLA","PIERNA","TOBILLO","PIE","CUELLO","CLAVÍCULA","ESTERNÓN","COSTILLAS","SACROCOCCÍGEA","SACROILÍACA","TEMPOROMANDIBULAR","DENTAL","TC","RM","MAMOGRAFÍA","ECOGRAFÍA","OTRO"];
let patientFiles=[],addFiles=[];

function fillStudySelect(id,selected=""){
  const wrap=document.getElementById(id); if(!wrap)return;
  const value=(selected||"").toUpperCase();
  wrap.innerHTML=`<div class="study-search-wrap" title="Seleccionar estructura / estudio">
    <button type="button" class="study-search study-picker-btn" id="${id}Picker">
      <span id="${id}Label">${value || "SELECCIONA ESTRUCTURA / ESTUDIO"}</span>
      <span class="study-picker-arrow">▾</span>
    </button>
    <div class="study-options" id="${id}Options"></div>
  </div>
  <div class="study-selected" id="${id}Selected">${value ? "ESTRUCTURA SELECCIONADA: "+value : "SELECCIONAR ESTRUCTURA / ESTUDIO"}</div>`;
  const picker=document.getElementById(id+"Picker");
  picker?.addEventListener("click",e=>{
    e.preventDefault();
    e.stopPropagation();
    const opts=document.getElementById(id+"Options");
    renderStudyOptions(id,"");
    opts?.classList.toggle("show");
  });
  renderStudyOptions(id,"");
}
function renderStudyOptions(id,term=""){
  const opts=document.getElementById(id+"Options"); if(!opts)return;
  const q=(term||"").toUpperCase().trim();
  const matches=STUDIES.filter(s=>!q||s.includes(q));
  opts.innerHTML=matches.map(s=>`<button type="button" class="study-option" onclick='chooseStudy(${JSON.stringify(id)},${JSON.stringify(s)})'>${s}</button>`).join("")
    || `<div style="padding:12px;color:var(--muted)">NO SE ENCONTRARON ESTRUCTURAS</div>`;
}
function showStudies(id){
  const opts=document.getElementById(id+"Options"); if(!opts)return;
  renderStudyOptions(id,"");
  opts.classList.add("show");
}
function chooseStudy(id,value){
  const label=document.getElementById(id+"Label");
  if(label)label.textContent=value;
  const selected=document.getElementById(id+"Selected");
  if(selected)selected.textContent="ESTRUCTURA SELECCIONADA: "+value;
  document.getElementById(id+"Options")?.classList.remove("show");
}
function getStudyValue(id){return (document.getElementById(id+"Label")?.textContent||"").trim().toUpperCase();}

function openAddPatient(){if(currentRole!=="admin"){toast("Solo el Administrador puede agregar pacientes.");return;}document.getElementById("patientModalTitle").textContent="Agregar paciente";document.getElementById("pName").value="";document.getElementById("pDni").value="";document.getElementById("pSex").value="";document.getElementById("pBirth").value="";document.getElementById("pStudyDate").textContent=selectedDate;patientFiles=[];document.getElementById("patientFiles").innerHTML="";fillStudySelect("pStudyType");showStudies("pStudyType");openModal("patientModal");}
function openEditPatient(){if(currentRole!=="admin"){toast("Solo el Administrador puede modificar pacientes.");return;}if(!sel){toast("Selecciona un paciente primero.");return;}document.getElementById("eName").value=sel.n;document.getElementById("eDni").value=sel.dni||"";document.getElementById("eSex").value="";document.getElementById("eBirth").value=sel.birth||"";openModal("editModal");}
function openAddImages(){if(currentRole!=="admin"){toast("Solo el Administrador puede añadir imágenes.");return;}if(!sel){toast("Selecciona un paciente primero.");return;}document.getElementById("aPatient").value=sel.n;document.getElementById("aStudyDate").value=selectedDate;const currentStudy=sel.s?.[si]?.[1]||"";fillStudySelect("aStudyType",currentStudy);showStudies("aStudyType");addFiles=[];document.getElementById("addFiles").innerHTML="";openModal("imagesModal");}
function openDeleteImage(){if(currentRole!=="admin"){toast("Solo el Administrador puede eliminar imágenes.");return;}if(!sel){toast("Selecciona un paciente primero.");return;}const study=sel.s?.[si];if(!study){toast("No hay estudio seleccionado.");return;}if((study[2]||0)<=0){toast("No hay imágenes para eliminar.");return;}document.getElementById("confirmTitle").textContent="Eliminar imagen";document.getElementById("confirmText").innerHTML=`¿ELIMINAR LA IMAGEN <b>${img}</b> del estudio <b>${study[1]}</b>?<br><br>Esta acción <b>no eliminará al paciente</b> ni las demás imágenes.`;document.getElementById("confirmBtn").onclick=()=>{study[2]=Math.max(0,study[2]-1);img=Math.min(img,Math.max(1,study[2]));closeModal("confirmModal");toast("Imagen eliminada.");render();};openModal("confirmModal");}
function openDeletePatient(){if(currentRole!=="admin"){toast("Solo el Administrador puede eliminar pacientes.");return;}if(!sel){toast("Selecciona un paciente primero.");return;}document.getElementById("confirmTitle").textContent="Eliminar paciente";document.getElementById("confirmText").innerHTML=`¿ELIMINAR AL PACIENTE <b>${sel.n}</b>?<br><br>Se eliminarán sus datos, estudios e imágenes asociadas.`;document.getElementById("confirmBtn").onclick=()=>{const id=sel.id;const idx=P.findIndex(p=>p.id===id);if(idx>=0)P.splice(idx,1);sel=P[0]||null;si=0;img=1;closeModal("confirmModal");toast("Paciente eliminado.");render();};openModal("confirmModal");}

function handleFiles(files,target){const arr=Array.from(files||[]);if(target==="patientFiles")patientFiles.push(...arr);else addFiles.push(...arr);renderFileList(target==="patientFiles"?patientFiles:addFiles,target);}
function renderFileList(arr,target){const el=document.getElementById(target);if(!el)return;el.innerHTML=arr.map(f=>`<div class="file-row"><span>🖼️ ${f.name}</span><span>${Math.round(f.size/1024)} KB</span></div>`).join("");}
function bindDrop(id,target){const d=document.getElementById(id);if(!d)return;["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("drag")}));["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("drag")}));d.addEventListener("drop",e=>handleFiles(e.dataTransfer.files,target));}
async function savePatient(){
  if(currentRole!=="admin"){toast("Solo el Administrador puede agregar pacientes.");return;}
  const name=document.getElementById("pName").value.trim().toUpperCase();
  const structure=getStudyValue("pStudyType");
  const birth=document.getElementById("pBirth").value;
  const sex=document.getElementById("pSex").value;
  const dni=document.getElementById("pDni").value.trim();
  if(!name){toast("El nombre del paciente es obligatorio.");return;}
  if(!structure){toast("Selecciona una estructura / estudio.");return;}
  if(!supabaseClient){toast("No hay conexión con Supabase.");return;}

  const studyDateISO = (()=>{
    const [d,mon,y]=selectedDate.split(" ");
    const months={ENE:"01",FEB:"02",MAR:"03",ABR:"04",MAY:"05",JUN:"06",JUL:"07",AGO:"08",SEP:"09",OCT:"10",NOV:"11",DIC:"12"};
    return `${y}-${months[mon]}-${String(d).padStart(2,"0")}`;
  })();
  const modality = ({TC:"TC",RM:"RM",MAMOGRAFÍA:"MAMOGRAFÍA",ECOGRAFÍA:"ECOGRAFÍA"}[structure] || "RX");

  const btns=[...document.querySelectorAll("#patientModal .modal-actions button")];
  btns.forEach(b=>b.disabled=true);
  try{
    const {error}=await supabaseClient.from("studies").insert({
      patient:name,
      date:studyDateISO,
      study:structure,
      structure:structure,
      modality:modality,
      images:[]
    });
    if(error){
      console.error(error);
      toast("No se pudo guardar el paciente en Supabase.");
      return;
    }
    closeModal("patientModal");
    patientFiles=[];
    await loadStudiesFromSupabase();
    toast("Paciente agregado correctamente.");
    render();
  }catch(err){
    console.error(err);
    toast("Ocurrió un error al guardar el paciente.");
  }finally{btns.forEach(b=>b.disabled=false);}
}

document.addEventListener("click",e=>{
  document.querySelectorAll(".study-options.show").forEach(x=>{if(!x.parentElement.contains(e.target))x.classList.remove("show")});
  const cw=document.querySelector(".date-wrap"),cp=document.getElementById("calendarPopup");
  if(cp&&cw&&!cw.contains(e.target))cp.classList.remove("show");
  const u=document.querySelector(".user"),m=document.getElementById("menu");
  if(m&&u&&!u.contains(e.target))m.classList.remove("show");
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    document.querySelectorAll(".modal-bg.show").forEach(m=>m.classList.remove("show"));
    document.querySelectorAll(".study-options.show").forEach(x=>x.classList.remove("show"));
    document.getElementById("calendarPopup")?.classList.remove("show");
    document.getElementById("menu")?.classList.remove("show");
    document.getElementById("side")?.classList.remove("open");
    document.getElementById("overlay")?.classList.remove("show");
  }

  if(e.key==="Enter" && document.getElementById("loginModal")?.classList.contains("show")){
    const tag=(e.target?.tagName||"").toLowerCase();
    if(tag==="input" || tag==="button"){
      e.preventDefault();
      document.getElementById("loginSubmit")?.click();
    }
  }

  const active=document.activeElement;
  if(active?.classList.contains("study-search")){
    if(e.key.length===1 && /[a-zA-ZÁÉÍÓÚáéíóúÑñ ]/.test(e.key)){
      e.preventDefault();
      filterStudies(active.id.replace("Search",""),(active.value+e.key).toUpperCase());
    } else if(e.key==="Backspace"){
      e.preventDefault();
      filterStudies(active.id.replace("Search",""),active.value.slice(0,-1));
    }
  }
});

initSupabase();
restoreSession();
home();
